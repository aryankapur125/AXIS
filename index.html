  /* ---------- master render ---------- */
  function render(){
    const root = document.getElementById('app');
    if(!root) return;

    let mainHtml = '';
    if(view.screen === 'home') mainHtml = renderHome();
    else if(view.screen === 'dayEdit') mainHtml = renderDayEdit();
    else if(view.screen === 'workout') mainHtml = renderWorkout();
    else if(view.screen === 'history') mainHtml = renderHistory();
    else if(view.screen === 'historyDetail') mainHtml = renderHistoryDetail();
    else if(view.screen === 'nutrition') mainHtml = renderNutrition();

    const modalsHtml = renderProgressModal() + renderNutritionModal() + renderMuscleLogModal() + renderSettingsModal();
    root.innerHTML = mainHtml + modalsHtml;
  }

  /* ---------- event handlers & delegated actions ---------- */
  function handleAction(action, el, e){
    if(action === 'nav'){
      const target = el.getAttribute('data-target');
      view.screen = target;
      render();
      return;
    }
    if(action === 'open-settings'){ view.settingsModal = true; render(); return; }
    if(action === 'close-settings'){ view.settingsModal = false; render(); return; }

    if(action === 'edit-day'){
      view.dayEditId = el.getAttribute('data-day');
      view.screen = 'dayEdit';
      render();
      return;
    }
    if(action === 'goto-home'){ view.screen = 'home'; render(); return; }
    if(action === 'goto-workout'){ view.screen = 'workout'; render(); return; }
    if(action === 'goto-history'){ view.screen = 'history'; render(); return; }

    if(action === 'start-workout'){
      const dayId = el.getAttribute('data-day');
      startWorkout(dayId);
      return;
    }
    if(action === 'request-discard'){
      discardWorkout();
      return;
    }
    if(action === 'finish-workout'){
      finishWorkout();
      return;
    }

    if(action === 'toggle-chooser'){
      const scope = el.getAttribute('data-scope');
      const day = el.getAttribute('data-day');
      if(view.chooserOpen && view.chooserOpen.scope === scope && view.chooserOpen.day === day){
        view.chooserOpen = null;
      } else {
        view.chooserOpen = { scope, day };
      }
      render();
      return;
    }

    if(action === 'add-item'){
      const scope = el.getAttribute('data-scope');
      const type = el.getAttribute('data-type');
      view.chooserOpen = null;
      if(scope === 'template'){
        const day = getDay(el.getAttribute('data-day'));
        if(day){
          if(type === 'run') day.items.push({ id:uid(), itemType:'run' });
          else day.items.push({ id:uid(), itemType:'exercise', name:'', restSeconds:105, defaultSets:2 });
          saveState(); render();
        }
      } else if(scope === 'active' && state.active){
        if(type === 'run') state.active.items.push({ id:uid(), itemType:'run', distanceKm:'', durationSec:0 });
        else state.active.items.push({ id:uid(), itemType:'exercise', name:'', restSeconds:105, sets:[{ id:uid(), reps:'', weight:'', completed:false }] });
        saveState(); render();
      }
      return;
    }

    if(action === 'delete-item'){
      const dayId = el.getAttribute('data-day');
      const exId = el.getAttribute('data-ex');
      if(dayId){
        const day = getDay(dayId);
        if(day){ day.items = day.items.filter(i => i.id !== exId); saveState(); render(); }
      } else if(state.active){
        state.active.items = state.active.items.filter(i => i.id !== exId);
        stopRestTimerFor(exId);
        saveState(); render();
      }
      return;
    }

    if(action === 'move-up' || action === 'move-down'){
      const dir = action === 'move-up' ? -1 : 1;
      const dayId = el.getAttribute('data-day');
      const exId = el.getAttribute('data-ex');
      if(dayId){
        const day = getDay(dayId);
        if(day){ moveItem(day.items, exId, dir); saveState(); render(); }
      } else if(state.active){
        moveItem(state.active.items, exId, dir);
        saveState(); render();
      }
      return;
    }

    if(action === 'add-set'){
      const exId = el.getAttribute('data-ex');
      const item = findItemInActive(exId);
      if(item && item.itemType === 'exercise'){
        const last = item.sets[item.sets.length-1];
        item.sets.push({ id:uid(), reps: last?last.reps:'', weight: last?last.weight:'', completed:false });
        saveState(); refreshItemCard(exId);
      }
      return;
    }

    if(action === 'delete-set'){
      const exId = el.getAttribute('data-ex');
      const setId = el.getAttribute('data-set');
      const item = findItemInActive(exId);
      if(item && item.itemType === 'exercise'){
        item.sets = item.sets.filter(s => s.id !== setId);
        saveState(); refreshItemCard(exId);
      }
      return;
    }

    if(action === 'toggle-set'){
      const exId = el.getAttribute('data-ex');
      const setId = el.getAttribute('data-set');
      const item = findItemInActive(exId);
      if(item && item.itemType === 'exercise'){
        const s = item.sets.find(x => x.id === setId);
        if(s){
          s.completed = !s.completed;
          if(s.completed){
            const sec = item.restSeconds || 105;
            startRestTimerFor(exId, sec);
            triggerRestShortcut(sec);
          }
          saveState(); refreshItemCard(exId);
        }
      }
      return;
    }

    if(action === 'rest-adjust'){
      const exId = el.getAttribute('data-ex');
      const delta = Number(el.getAttribute('data-delta'))||0;
      if(restTimers[exId] && restTimers[exId].running){
        restTimers[exId].remaining = Math.max(5, restTimers[exId].remaining + delta);
        restTimers[exId].total = Math.max(5, restTimers[exId].total + delta);
        tickRestRow(exId);
      } else if(state.active){
        const item = findItemInActive(exId);
        if(item){ item.restSeconds = Math.max(15, (item.restSeconds||105) + delta); saveState(); refreshRestRow(exId); }
      }
      return;
    }

    if(action === 'rest-skip'){
      const exId = el.getAttribute('data-ex');
      stopRestTimerFor(exId);
      refreshRestRow(exId);
      return;
    }

    if(action === 'rest-adjust-template'){
      const dayId = el.getAttribute('data-day');
      const exId = el.getAttribute('data-ex');
      const delta = Number(el.getAttribute('data-delta'))||0;
      const day = getDay(dayId);
      if(day){
        const it = day.items.find(x => x.id === exId);
        if(it){ it.restSeconds = Math.max(15, (it.restSeconds||105)+delta); saveState(); render(); }
      }
      return;
    }

    if(action === 'show-progress'){
      view.progressModalExId = el.getAttribute('data-ex');
      render();
      return;
    }
    if(action === 'close-progress'){
      view.progressModalExId = null;
      render();
      return;
    }

    if(action === 'cal-prev'){
      if(view.cal.month === 0){ view.cal.month = 11; view.cal.year -= 1; }
      else view.cal.month -= 1;
      render();
      return;
    }
    if(action === 'cal-next'){
      if(view.cal.month === 11){ view.cal.month = 0; view.cal.year += 1; }
      else view.cal.month += 1;
      render();
      return;
    }
    if(action === 'open-calendar-day'){
      const ds = el.getAttribute('data-date');
      const entry = state.history.find(h => h.date === ds);
      if(entry){ view.historyId = entry.id; view.screen = 'historyDetail'; render(); }
      return;
    }

    if(action === 'delete-history'){
      const id = el.getAttribute('data-id');
      if(confirm('Delete this saved workout?')){
        state.history = state.history.filter(h => h.id !== id);
        saveState(); view.screen = 'history'; render();
      }
      return;
    }
    if(action === 'delete-hist-set'){
      const hId = el.getAttribute('data-hist');
      const itemIdx = Number(el.getAttribute('data-itemidx'));
      const setId = el.getAttribute('data-set');
      const h = state.history.find(x => x.id === hId);
      if(h && h.items[itemIdx]){
        h.items[itemIdx].sets = h.items[itemIdx].sets.filter(s => s.id !== setId);
        saveState(); render();
      }
      return;
    }

    if(action === 'open-edit-profile'){ view.nutModal = { type:'profile' }; render(); return; }
    if(action === 'open-food-picker'){ view.nutModal = { type:'foodPicker', mealSlot: el.getAttribute('data-meal') }; view.nutSearchQuery = ''; render(); return; }
    if(action === 'open-create-food'){ view.nutModal = { type:'createFood', mealSlot: view.nutModal?view.nutModal.mealSlot:'breakfast' }; render(); return; }
    if(action === 'open-meal-builder'){ view.nutModal = { type:'mealBuilder', mealSlot: view.nutModal?view.nutModal.mealSlot:'breakfast' }; view.mealBuilder = { name:'', items:[] }; view.nutSearchQuery = ''; render(); return; }
    if(action === 'close-modal'){ view.nutModal = null; render(); return; }

    if(action === 'log-library-item'){
      const id = el.getAttribute('data-id');
      const item = state.nutrition.library.find(x => x.id === id);
      if(item && view.nutModal && view.nutModal.mealSlot){
        const ds = nutToday();
        const log = getDayLog(ds);
        log[view.nutModal.mealSlot].push({ id:uid(), name:item.name, cals:item.cals, protein:item.protein, carbs:item.carbs, fat:item.fat, qty:1 });
        saveState(); view.nutModal = null; render();
      }
      return;
    }
    if(action === 'delete-library-item'){
      const id = el.getAttribute('data-id');
      state.nutrition.library = state.nutrition.library.filter(x => x.id !== id);
      saveState(); render();
      return;
    }

    if(action === 'log-qty-adjust'){
      const meal = el.getAttribute('data-meal');
      const id = el.getAttribute('data-id');
      const delta = Number(el.getAttribute('data-delta'))||0;
      const log = getDayLog(nutToday())[meal];
      if(log){
        const e = log.find(x => x.id === id);
        if(e){
          e.qty = Math.max(0.5, (e.qty||1) + delta*0.5);
          saveState(); render();
        }
      }
      return;
    }
    if(action === 'delete-log-entry'){
      const meal = el.getAttribute('data-meal');
      const id = el.getAttribute('data-id');
      const log = getDayLog(nutToday());
      if(log && log[meal]){ log[meal] = log[meal].filter(x => x.id !== id); saveState(); render(); }
      return;
    }

    if(action === 'mb-add-library-item'){
      const id = el.getAttribute('data-id');
      const libItem = state.nutrition.library.find(x => x.id === id);
      if(libItem && view.mealBuilder){
        view.mealBuilder.items.push({ id:uid(), name:libItem.name, cals:libItem.cals, protein:libItem.protein, carbs:libItem.carbs, fat:libItem.fat, qty:1 });
        render();
      }
      return;
    }
    if(action === 'mb-adjust-qty'){
      const idx = Number(el.getAttribute('data-idx'));
      const delta = Number(el.getAttribute('data-delta'))||0;
      if(view.mealBuilder && view.mealBuilder.items[idx]){
        const it = view.mealBuilder.items[idx];
        it.qty = Math.max(1, (it.qty||1) + delta);
        render();
      }
      return;
    }
    if(action === 'mb-remove-item'){
      const idx = Number(el.getAttribute('data-idx'));
      if(view.mealBuilder){ view.mealBuilder.items.splice(idx,1); render(); }
      return;
    }
    if(action === 'save-built-meal'){
      const mb = view.mealBuilder;
      if(!mb || !mb.items.length) return;
      let totalCals=0, totalP=0, totalC=0, totalF=0;
      mb.items.forEach(it => { const q=it.qty||1; totalCals+=it.cals*q; totalP+=it.protein*q; totalC+=it.carbs*q; totalF+=it.fat*q; });
      const name = mb.name.trim() || 'Built Meal';
      const slot = view.nutModal ? view.nutModal.mealSlot : 'breakfast';
      const log = getDayLog(nutToday());
      log[slot].push({ id:uid(), name, cals:Math.round(totalCals), protein:Math.round(totalP), carbs:Math.round(totalC), fat:Math.round(totalF), qty:1 });
      saveState(); view.nutModal = null; view.mealBuilder = null; render();
      return;
    }

    if(action === 'open-muscle-log'){ view.muscleLogOpen = true; render(); return; }
    if(action === 'close-muscle-log'){ view.muscleLogOpen = false; render(); return; }
    if(action === 'delete-manual-muscle'){
      const id = el.getAttribute('data-id');
      state.manualMuscleLog = (state.manualMuscleLog||[]).filter(m => m.id !== id);
      saveState(); render();
      return;
    }
  }

  /* ---------- global listeners ---------- */
  document.addEventListener('click', (e) => {
    const btn = e.target.closest('[data-action]');
    if(btn){ handleAction(btn.getAttribute('data-action'), btn, e); }
  });

  document.addEventListener('input', (e) => {
    const bind = e.target.getAttribute('data-bind');
    if(!bind) return;

    if(bind === 'template-exname'){
      const day = getDay(e.target.getAttribute('data-day'));
      if(day){
        const it = day.items.find(x => x.id === e.target.getAttribute('data-ex'));
        if(it){ it.name = e.target.value; saveState(); }
      }
      return;
    }
    if(bind === 'ex-name' && state.active){
      const it = findItemInActive(e.target.getAttribute('data-ex'));
      if(it){ it.name = e.target.value; saveState(); }
      return;
    }
    if(bind === 'set-weight' && state.active){
      const it = findItemInActive(e.target.getAttribute('data-ex'));
      if(it && it.sets){
        const s = it.sets.find(x => x.id === e.target.getAttribute('data-set'));
        if(s){ s.weight = e.target.value; saveState(); }
      }
      return;
    }
    if(bind === 'set-reps' && state.active){
      const it = findItemInActive(e.target.getAttribute('data-ex'));
      if(it && it.sets){
        const s = it.sets.find(x => x.id === e.target.getAttribute('data-set'));
        if(s){ s.reps = e.target.value; saveState(); }
      }
      return;
    }
    if(bind === 'run-distance' && state.active){
      const it = findItemInActive(e.target.getAttribute('data-ex'));
      if(it){
        it.distanceKm = e.target.value;
        saveState();
        const paceEl = document.getElementById('pace-'+it.id);
        if(paceEl){
          const d = Number(it.distanceKm);
          paceEl.textContent = (d>0 && it.durationSec>0) ? secToMMSS(it.durationSec/d) : '—';
        }
      }
      return;
    }
    if(bind === 'run-duration' && state.active){
      const it = findItemInActive(e.target.getAttribute('data-ex'));
      if(it){
        it.durationSec = mmssToSec(e.target.value);
        saveState();
        const paceEl = document.getElementById('pace-'+it.id);
        if(paceEl){
          const d = Number(it.distanceKm);
          paceEl.textContent = (d>0 && it.durationSec>0) ? secToMMSS(it.durationSec/d) : '—';
        }
      }
      return;
    }

    if(bind === 'hist-run-distance'){
      const h = state.history.find(x => x.id === e.target.getAttribute('data-hist'));
      const idx = Number(e.target.getAttribute('data-itemidx'));
      if(h && h.items[idx]){ h.items[idx].distanceKm = Number(e.target.value)||0; saveState(); }
      return;
    }
    if(bind === 'hist-run-duration'){
      const h = state.history.find(x => x.id === e.target.getAttribute('data-hist'));
      const idx = Number(e.target.getAttribute('data-itemidx'));
      if(h && h.items[idx]){ h.items[idx].durationSec = mmssToSec(e.target.value); saveState(); }
      return;
    }
    if(bind === 'hist-set-weight'){
      const h = state.history.find(x => x.id === e.target.getAttribute('data-hist'));
      const idx = Number(e.target.getAttribute('data-itemidx'));
      const setId = e.target.getAttribute('data-set');
      if(h && h.items[idx] && h.items[idx].sets){
        const s = h.items[idx].sets.find(x => x.id === setId);
        if(s){ s.weight = e.target.value; saveState(); }
      }
      return;
    }
    if(bind === 'hist-set-reps'){
      const h = state.history.find(x => x.id === e.target.getAttribute('data-hist'));
      const idx = Number(e.target.getAttribute('data-itemidx'));
      const setId = e.target.getAttribute('data-set');
      if(h && h.items[idx] && h.items[idx].sets){
        const s = h.items[idx].sets.find(x => x.id === setId);
        if(s){ s.reps = e.target.value; saveState(); }
      }
      return;
    }

    if(bind === 'nut-search'){ view.nutSearchQuery = e.target.value; render(); return; }
    if(bind === 'mb-name'){ if(view.mealBuilder) view.mealBuilder.name = e.target.value; return; }

    if(bind === 'toggle-shortcut'){ state.settings.restShortcutEnabled = e.target.checked; saveState(); return; }
    if(bind === 'shortcut-name'){ state.settings.restShortcutName = e.target.value; saveState(); return; }
  });

  document.addEventListener('submit', (e) => {
    const sub = e.target.getAttribute('data-submit');
    if(!sub) return;
    e.preventDefault();
    const fd = new FormData(e.target);

    if(sub === 'save-profile'){
      const p = state.nutrition.profile;
      p.heightCm = Number(fd.get('heightCm'))||p.heightCm;
      p.weightKg = Number(fd.get('weightKg'))||p.weightKg;
      p.calorieTarget = Number(fd.get('calorieTarget'))||p.calorieTarget;
      p.goal = String(fd.get('goal')||'').trim();
      p.rateNote = String(fd.get('rateNote')||'').trim();
      p.sleepHours = parseHoursFlexible(fd.get('sleepHours'));
      p.macros.protein = Number(fd.get('protein'))||p.macros.protein;
      p.macros.carbs = Number(fd.get('carbs'))||p.macros.carbs;
      p.macros.fat = Number(fd.get('fat'))||p.macros.fat;
      saveState(); view.nutModal = null; render();
      return;
    }

    if(sub === 'save-new-food'){
      const name = String(fd.get('name')||'').trim();
      const cals = Number(fd.get('cals'))||0;
      const protein = Number(fd.get('protein'))||0;
      const carbs = Number(fd.get('carbs'))||0;
      const fat = Number(fd.get('fat'))||0;
      const saveToLib = fd.get('saveToLib') === 'on';
      const slot = view.nutModal ? view.nutModal.mealSlot : 'breakfast';
      if(saveToLib){
        state.nutrition.library.unshift({ id:uid(), name, cals, protein, carbs, fat });
      }
      const log = getDayLog(nutToday());
      log[slot].push({ id:uid(), name, cals, protein, carbs, fat, qty:1 });
      saveState(); view.nutModal = null; render();
      return;
    }

    if(sub === 'add-manual-muscle'){
      const muscle = String(fd.get('muscle'));
      const sets = Number(fd.get('sets'))||1;
      const date = String(fd.get('date')) || toDateStr(Date.now());
      if(!Array.isArray(state.manualMuscleLog)) state.manualMuscleLog = [];
      state.manualMuscleLog.push({ id:uid(), muscle, sets, date });
      saveState(); render();
      return;
    }
  });

  /* ---------- initialization ---------- */
  loadState().then(() => {
    render();
  });

})();
</script>
</body>
</html>
