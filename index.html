  function renderNutModal(){
    const m = view.nutModal;
    if(!m) return '';
    if(m.type === 'picker') return renderPickerModal(m.meal);
    if(m.type === 'customFood') return renderCustomFoodModal(m.meal);
    if(m.type === 'createMeal') return renderCreateMealModal();
    if(m.type === 'targets') return renderTargetsModal();
    return '';
  }

  function navBar(active){
    return `
      <div class="bottom-nav">
        <button class="nav-item ${active==='home'?'active':''}" data-action="goto-home">${ICON_DUMBBELL}<span>Train</span></button>
        <button class="nav-item ${active==='nutrition'?'active':''}" data-action="goto-nutrition">${ICON_APPLE}<span>Recover</span></button>
        <button class="nav-item ${active==='history'?'active':''}" data-action="goto-history">${ICON_CLOCK}<span>History</span></button>
      </div>`;
  }

  /* ---------- master render ---------- */
  function render(){
    const root = document.getElementById('app');
    let html = '';
    switch(view.screen){
      case 'home': html = renderHome(); break;
      case 'dayEdit': html = renderDayEdit(); break;
      case 'workout': html = renderWorkout(); break;
      case 'history': html = renderHistory(); break;
      case 'historyDetail': html = renderHistoryDetail(); break;
      case 'nutrition': html = renderNutrition(); break;
      default: html = renderHome();
    }
    root.innerHTML = html + renderProgressModal() + renderNutModal() + (view.settingsModal ? renderSettingsModal() : '') + (view.muscleLogOpen ? renderMuscleLogModal() : '');
  }

  /* ---------- actions ---------- */
  const actions = {
    'goto-home'(){ view.screen='home'; view.chooserOpen=null; render(); },
    'goto-history'(){ view.screen='history'; render(); },
    'goto-workout'(){ view.screen='workout'; render(); },
    'goto-nutrition'(){ view.screen='nutrition'; view.nutModal=null; render(); },

    'open-settings'(){ view.settingsModal = true; render(); },
    'close-settings'(){ view.settingsModal = false; render(); },
    'save-settings'(){
      state.settings.restShortcutEnabled = document.getElementById('st-enabled').checked;
      state.settings.restShortcutName = document.getElementById('st-name').value.trim() || 'Rest Timer';
      view.settingsModal = false;
      saveState(); render();
    },

    'open-muscle-log'(){ view.muscleLogOpen = true; render(); },
    'close-muscle-log'(){ view.muscleLogOpen = false; render(); },
    'add-muscle-log'(){
      const muscle = document.getElementById('ml-muscle').value;
      const sets = Number(document.getElementById('ml-sets').value);
      if(!sets || sets <= 0){ alert('Enter how many sets you did.'); return; }
      if(!Array.isArray(state.manualMuscleLog)) state.manualMuscleLog = [];
      state.manualMuscleLog.push({ id: uid(), date: toDateStr(Date.now()), muscle, sets });
      saveState(); render();
      requestAnimationFrame(() => { const el = document.getElementById('ml-sets'); if(el) el.focus(); });
    },
    'delete-muscle-log'(ds){
      state.manualMuscleLog = (state.manualMuscleLog||[]).filter(m => m.id !== ds.id);
      saveState(); render();
    },

    'open-food-picker'(ds){ view.nutModal = { type:'picker', meal: ds.meal }; view.nutSearchQuery=''; render(); },
    'close-nut-modal'(){ view.nutModal=null; view.mealBuilder=null; render(); },
    'log-lib-item'(ds){
      const it = state.nutrition.library.find(x => x.id === ds.id);
      if(!it) return;
      const log = getDayLog(nutToday());
      log[ds.meal].push({ id: uid(), name: it.name, cals: it.cals, protein: it.protein, carbs: it.carbs, fat: it.fat, qty: 1 });
      view.nutModal = null;
      saveState(); render();
    },
    'delete-lib-item'(ds){
      if(!confirm('Remove this from your saved foods?')) return;
      state.nutrition.library = state.nutrition.library.filter(x => x.id !== ds.id);
      saveState();
      const listEl = document.getElementById('nut-lib-list');
      if(listEl && view.nutModal) listEl.innerHTML = renderLibList(view.nutModal.meal, view.nutSearchQuery); else render();
    },

    'open-custom-food'(ds){ view.nutModal = { type:'customFood', meal: ds.meal }; render(); },
    'save-custom-food'(){
      const meal = view.nutModal.meal;
      const name = document.getElementById('nf-name').value.trim();
      if(!name){ alert('Give this food a name.'); return; }
      const cals = Number(document.getElementById('nf-cals').value) || 0;
      const protein = Number(document.getElementById('nf-protein').value) || 0;
      const carbs = Number(document.getElementById('nf-carbs').value) || 0;
      const fat = Number(document.getElementById('nf-fat').value) || 0;
      const saveLib = document.getElementById('nf-save-lib').checked;
      const log = getDayLog(nutToday());
      log[meal].push({ id: uid(), name, cals, protein, carbs, fat, qty: 1 });
      if(saveLib) state.nutrition.library.push({ id: uid(), kind:'food', name, cals, protein, carbs, fat });
      view.nutModal = null;
      saveState(); render();
    },

    'open-create-meal'(ds){ view.mealBuilder = { components: [] }; view.nutModal = { type:'createMeal', meal: ds.meal }; render(); },
    'mb-add-component'(){
      const name = document.getElementById('mb-c-name').value.trim();
      if(!name) return;
      const cals = Number(document.getElementById('mb-c-cals').value) || 0;
      const protein = Number(document.getElementById('mb-c-protein').value) || 0;
      const carbs = Number(document.getElementById('mb-c-carbs').value) || 0;
      const fat = Number(document.getElementById('mb-c-fat').value) || 0;
      view.mealBuilder.name = document.getElementById('mb-name').value;
      view.mealBuilder.components.push({ id: uid(), name, cals, protein, carbs, fat });
      render();
      requestAnimationFrame(() => { const el = document.getElementById('mb-c-name'); if(el) el.focus(); });
    },
    'mb-remove-component'(ds){
      view.mealBuilder.name = document.getElementById('mb-name').value;
      view.mealBuilder.components = view.mealBuilder.components.filter(c => c.id !== ds.id);
      render();
    },
    'save-meal'(){
      const meal = view.nutModal.meal;
      const name = document.getElementById('mb-name').value.trim();
      if(!name){ alert('Name this recipe.'); return; }
      const comps = view.mealBuilder.components;
      if(comps.length === 0){ alert('Add at least one item to this recipe.'); return; }
      const totals = comps.reduce((a,c) => ({ cals:a.cals+c.cals, protein:a.protein+c.protein, carbs:a.carbs+c.carbs, fat:a.fat+c.fat }), {cals:0,protein:0,carbs:0,fat:0});
      const libItem = { id: uid(), kind:'meal', name, cals: totals.cals, protein: totals.protein, carbs: totals.carbs, fat: totals.fat,
        components: comps.map(c => ({ name:c.name, cals:c.cals, protein:c.protein, carbs:c.carbs, fat:c.fat })) };
      state.nutrition.library.push(libItem);
      const log = getDayLog(nutToday());
      log[meal].push({ id: uid(), name, cals: totals.cals, protein: totals.protein, carbs: totals.carbs, fat: totals.fat, qty: 1 });
      view.mealBuilder = null;
      view.nutModal = null;
      saveState(); render();
    },

    'log-qty-adjust'(ds){
      const log = getDayLog(nutToday());
      const e = (log[ds.meal]||[]).find(x => x.id === ds.id);
      if(!e) return;
      e.qty = Math.max(1, (e.qty||1) + Number(ds.delta));
      saveState(); render();
    },
    'delete-log-entry'(ds){
      const log = getDayLog(nutToday());
      log[ds.meal] = (log[ds.meal]||[]).filter(x => x.id !== ds.id);
      saveState(); render();
    },

    'profile-select-goal'(ds){ view.nutModal.goalSel = ds.goal; render(); },
    'open-targets-edit'(){ view.nutModal = { type:'targets', goalSel: state.nutrition.profile.goal }; render(); },
    'save-intention'(){
      const p = state.nutrition.profile;
      p.goal = view.nutModal.goalSel || p.goal;
      const rateEl = document.getElementById('ei-rate');
      if(rateEl) p.rateNote = rateEl.value.trim();
      view.nutModal = null;
      saveState(); render();
    },
    'start-workout'(ds){ startWorkout(ds.day); },
    'edit-day'(ds){ view.dayEditId = ds.day; view.screen='dayEdit'; view.chooserOpen=null; render(); },

    'toggle-chooser'(ds){
      const same = view.chooserOpen && view.chooserOpen.scope===ds.scope && view.chooserOpen.day===ds.day;
      view.chooserOpen = same ? null : { scope: ds.scope, day: ds.day };
      if(ds.scope === 'active') refreshItemsContainer(); else render();
    },
    'add-item'(ds){
      const isTemplate = ds.scope === 'template';
      const arr = isTemplate ? getDay(ds.day).items : state.active.items;
      if(ds.type === 'exercise'){
        arr.push(isTemplate
          ? { id: uid(), itemType:'exercise', name:'', restSeconds:105 }
          : { id: uid(), itemType:'exercise', name:'', restSeconds:105, sets:[{ id: uid(), reps:'', weight:'', completed:false }] });
      } else {
        arr.push(isTemplate
          ? { id: uid(), itemType:'run' }
          : { id: uid(), itemType:'run', distanceKm:'', durationSec:0 });
      }
      view.chooserOpen = null;
      saveState();
      if(isTemplate) render(); else refreshItemsContainer();
      if(ds.type === 'exercise'){
        requestAnimationFrame(() => {
          const sel = isTemplate ? `[data-bind="template-exname"][data-day="${ds.day}"]` : '[data-bind="ex-name"]';
          const inputs = document.querySelectorAll(sel);
          if(inputs.length) inputs[inputs.length-1].focus();
        });
      }
    },
    'move-up'(ds){ const arr = ds.day ? getDay(ds.day).items : state.active.items; moveItem(arr, ds.ex, -1); saveState(); if(ds.day) render(); else refreshItemsContainer(); },
    'move-down'(ds){ const arr = ds.day ? getDay(ds.day).items : state.active.items; moveItem(arr, ds.ex, 1); saveState(); if(ds.day) render(); else refreshItemsContainer(); },
    'delete-item'(ds){
      const isTemplate = !!ds.day;
      const arr = isTemplate ? getDay(ds.day).items : state.active.items;
      const idx = arr.findIndex(i => i.id === ds.ex);
      if(idx < 0) return;
      if(!isTemplate && arr[idx].itemType==='exercise'){
        if(!confirm('Remove this exercise from today\'s workout?')) return;
      }
      arr.splice(idx,1);
      stopRestTimerFor(ds.ex);
      saveState();
      if(isTemplate) render(); else refreshItemsContainer();
    },
    'rest-adjust-template'(ds){
      const day = getDay(ds.day);
      const item = day.items.find(i => i.id === ds.ex);
      item.restSeconds = Math.max(15, (item.restSeconds||105) + Number(ds.delta));
      saveState(); render();
    },

    'add-set'(ds){
      const ex = findItemInActive(ds.ex);
      const last = ex.sets[ex.sets.length-1];
      ex.sets.push({ id: uid(), reps: last?last.reps:'', weight: last?last.weight:'', completed:false });
      saveState(); refreshItemCard(ds.ex);
    },
    'delete-set'(ds){
      const ex = findItemInActive(ds.ex);
      if(ex.sets.length <= 1){
        if(!confirm('Delete the last set for this exercise?')) return;
      }
      ex.sets = ex.sets.filter(s => s.id !== ds.set);
      saveState(); refreshItemCard(ds.ex);
    },
    'toggle-set'(ds){
      const ex = findItemInActive(ds.ex);
      const s = ex.sets.find(x => x.id === ds.set);
      s.completed = !s.completed;
      if(s.completed){
        startRestTimerFor(ex.id, ex.restSeconds||105);
        triggerRestShortcut(ex.restSeconds||105);
      }
      saveState(); refreshItemCard(ds.ex);
    },
    'rest-adjust'(ds){
      const item = findItemInActive(ds.ex);
      const delta = Number(ds.delta);
      item.restSeconds = Math.max(15, (item.restSeconds||105) + delta);
      const t = restTimers[ds.ex];
      if(t && t.running){
        t.remaining = Math.max(0, t.remaining + delta);
        t.total = Math.max(t.total, t.remaining);
        tickRestRow(ds.ex);
      } else {
        refreshRestRow(ds.ex);
      }
      saveState();
    },
    'rest-skip'(ds){ stopRestTimerFor(ds.ex); refreshRestRow(ds.ex); },

    'show-progress'(ds){ view.progressModalExId = ds.ex; render(); },
    'close-progress'(){ view.progressModalExId = null; render(); },

    'finish-workout'(){
      if(state.active.items.length === 0){
        if(!confirm('This workout is empty. Finish anyway?')) return;
      }
      finishWorkout();
    },
    'request-discard'(){ discardWorkout(); },
    'open-history'(ds){ view.historyId = ds.id; view.screen='historyDetail'; render(); },
    'delete-history'(ds){
      if(!confirm('Delete this workout from your history? This can\'t be undone.')) return;
      state.history = state.history.filter(h => h.id !== ds.id);
      saveState();
      view.screen = 'history';
      render();
    },
    'delete-hist-set'(ds){
      const h = state.history.find(x => x.id === ds.hist);
      const it = h && h.items[Number(ds.itemidx)];
      if(!it) return;
      it.sets = it.sets.filter(s => s.id !== ds.set);
      saveState(); render();
    },
    'cal-prev'(){ view.cal.month--; if(view.cal.month<0){ view.cal.month=11; view.cal.year--; } render(); },
    'cal-next'(){ view.cal.month++; if(view.cal.month>11){ view.cal.month=0; view.cal.year++; } render(); },
    'open-calendar-day'(ds){
      const entries = state.history.filter(h => h.date === ds.date);
      if(entries.length === 0) return;
      const target = entries.sort((a,b) => b.endedAt - a.endedAt)[0];
      view.historyId = target.id; view.screen = 'historyDetail'; render();
    }
  };

  function handleInput(el){
    const bind = el.dataset.bind;
    if(bind === 'template-exname'){
      const day = getDay(el.dataset.day);
      const item = day.items.find(i => i.id === el.dataset.ex);
      if(item) item.name = el.value;
    } else if(bind === 'ex-name'){
      const item = findItemInActive(el.dataset.ex);
      if(item) item.name = el.value;
    } else if(bind === 'set-reps'){
      const ex = findItemInActive(el.dataset.ex);
      const s = ex.sets.find(x => x.id === el.dataset.set);
      if(s) s.reps = el.value === '' ? '' : Number(el.value);
    } else if(bind === 'set-weight'){
      const ex = findItemInActive(el.dataset.ex);
      const s = ex.sets.find(x => x.id === el.dataset.set);
      if(s) s.weight = el.value === '' ? '' : Number(el.value);
    } else if(bind === 'run-distance'){
      const item = findItemInActive(el.dataset.ex);
      item.distanceKm = el.value === '' ? '' : Number(el.value);
      updatePaceDisplay(item);
    } else if(bind === 'run-duration'){
      const item = findItemInActive(el.dataset.ex);
      item.durationSec = mmssToSec(el.value);
      updatePaceDisplay(item);
    } else if(bind === 'nut-search'){
      view.nutSearchQuery = el.value;
      const listEl = document.getElementById('nut-lib-list');
      if(listEl && view.nutModal) listEl.innerHTML = renderLibList(view.nutModal.meal, el.value);
    } else if(bind === 'target-cals'){
      state.nutrition.profile.calorieTarget = Number(el.value);
      const v = document.getElementById('target-cals-val');
      if(v) v.textContent = trimNum(el.value) + ' kcal';
      el.style.background = sliderGradient(Number(el.value), Number(el.min), Number(el.max));
    } else if(bind === 'target-protein'){
      state.nutrition.profile.macros.protein = Number(el.value);
      const v = document.getElementById('target-protein-val');
      if(v) v.textContent = trimNum(el.value) + 'g';
      el.style.background = sliderGradient(Number(el.value), Number(el.min), Number(el.max));
    } else if(bind === 'target-carbs'){
      state.nutrition.profile.macros.carbs = Number(el.value);
      const v = document.getElementById('target-carbs-val');
      if(v) v.textContent = trimNum(el.value) + 'g';
      el.style.background = sliderGradient(Number(el.value), Number(el.min), Number(el.max));
    } else if(bind === 'target-fat'){
      state.nutrition.profile.macros.fat = Number(el.value);
      const v = document.getElementById('target-fat-val');
      if(v) v.textContent = trimNum(el.value) + 'g';
      el.style.background = sliderGradient(Number(el.value), Number(el.min), Number(el.max));
    } else if(bind === 'hist-set-weight'){
      const h = state.history.find(x => x.id === el.dataset.hist);
      const it = h && h.items[Number(el.dataset.itemidx)];
      const s = it && it.sets.find(x => x.id === el.dataset.set);
      if(s) s.weight = el.value === '' ? '' : Number(el.value);
    } else if(bind === 'hist-set-reps'){
      const h = state.history.find(x => x.id === el.dataset.hist);
      const it = h && h.items[Number(el.dataset.itemidx)];
      const s = it && it.sets.find(x => x.id === el.dataset.set);
      if(s) s.reps = el.value === '' ? '' : Number(el.value);
    } else if(bind === 'hist-run-distance'){
      const h = state.history.find(x => x.id === el.dataset.hist);
      const it = h && h.items[Number(el.dataset.itemidx)];
      if(it) it.distanceKm = el.value === '' ? '' : Number(el.value);
    } else if(bind === 'hist-run-duration'){
      const h = state.history.find(x => x.id === el.dataset.hist);
      const it = h && h.items[Number(el.dataset.itemidx)];
      if(it) it.durationSec = mmssToSec(el.value);
    }
  }
  function updatePaceDisplay(item){
    const el = document.getElementById('pace-'+item.id);
    if(!el) return;
    const dist = Number(item.distanceKm)||0;
    el.textContent = dist>0 ? secToMMSS(item.durationSec/dist) : '—';
  }

  function ingestSyncParams(){
    const params = new URLSearchParams(window.location.search);
    let changed = false;
    if(params.has('weight')){
      const v = extractNumber(params.get('weight'));
      if(v != null && isFinite(v) && v > 0){ state.nutrition.profile.weightKg = v; changed = true; }
    }
    if(params.has('sleep')){
      const v = parseHoursFlexible(params.get('sleep'));
      if(v != null && isFinite(v) && v > 0){ state.nutrition.profile.sleepHours = v; changed = true; }
    }
    if(changed){
      saveState(true);
      try{ window.history.replaceState(null, '', window.location.pathname); }catch(e){}
    }
  }

  document.addEventListener('DOMContentLoaded', init);

  async function init(){
    document.getElementById('app').innerHTML = '<div style="display:flex;align-items:center;justify-content:center;height:100vh;color:#8a8a86;font-size:13px;">Loading…</div>';
    await loadState();
    ingestSyncParams();
    render();

    const root = document.getElementById('app-root');
    // Force a repaint right after this initial load. When the page is opened
    // programmatically (e.g. the iOS Shortcuts automation that writes weight/
    // sleep in via URL params) WebKit can leave freshly-injected content
    // unpainted — present and interactive in the DOM, just not drawn — until
    // something triggers a reflow. This nudges that without any visible flash.
    requestAnimationFrame(() => {
      root.style.opacity = '0.999';
      requestAnimationFrame(() => { root.style.opacity = '1'; });
    });
    root.addEventListener('click', (e) => {
      if(e.target.classList && e.target.classList.contains('modal-overlay')){
        if(view.settingsModal) actions['close-settings']();
        else if(view.muscleLogOpen) actions['close-muscle-log']();
        else if(view.nutModal && view.nutModal.type === 'targets') actions['save-intention']();
        else if(view.nutModal) actions['close-nut-modal']();
        else actions['close-progress']();
        return;
      }
      const btn = e.target.closest('[data-action]');
      if(!btn || !btn.dataset.action) return;
      const fn = actions[btn.dataset.action];
      if(fn) fn(btn.dataset);
    });
    root.addEventListener('input', (e) => {
      const el = e.target.closest('[data-bind]');
      if(!el) return;
      handleInput(el);
      saveState();
    });
    root.addEventListener('focusout', (e) => {
      if(e.target.closest('[data-bind]')) saveState();
    });

    let touchStartX = null;
    root.addEventListener('touchstart', (e) => {
      const cal = e.target.closest('.cal-grid');
      touchStartX = cal ? e.touches[0].clientX : null;
    }, {passive:true});
    root.addEventListener('touchend', (e) => {
      if(touchStartX === null) return;
      const dx = e.changedTouches[0].clientX - touchStartX;
      if(Math.abs(dx) > 40){
        if(dx < 0) actions['cal-next'](); else actions['cal-prev']();
      }
      touchStartX = null;
    });
  }
})();
</script>

<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("./sw.js");
  });
}
</script>
