<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<title>Axis — Training Log</title>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#060606">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Axis">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#060606;
    --surface:#121212;
    --surface-2:#1c1c1c;
    --border:#272727;
    --border-soft:#1b1b1b;
    --text:#f5f4f1;
    --text-dim:#8a8a86;
    --text-faint:#4d4d4a;
    
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;background:#000;height:100%;overflow:hidden;}
  body{
    font-family:'Lexend',-apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue",Arial,sans-serif;
    color:var(--text);
    -webkit-font-smoothing:antialiased;
    overscroll-behavior-y:none;
    text-transform:uppercase;
    letter-spacing:.01em;
  }
  button,input,select{font-family:inherit;color:inherit;text-transform:uppercase;}
  button{cursor:pointer;-webkit-appearance:none;appearance:none;}
  input{-webkit-appearance:none;appearance:none;}
  input:focus,button:focus{outline:none;}
  input[type=number]::-webkit-inner-spin-button,input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0;}
  input[type=number]{-moz-appearance:textfield;}

  #app-root{display:flex;justify-content:center;height:100vh;height:100dvh;background:#000;overflow:hidden;}
  .app{width:100%;max-width:460px;height:100vh;height:100dvh;background:var(--bg);display:flex;flex-direction:column;position:relative;overflow:hidden;}
  @media (min-width:480px){ .app{border-left:1px solid var(--border);border-right:1px solid var(--border);} }

  .screen{flex:1 1 auto;min-height:0;overflow-y:auto;display:flex;flex-direction:column;}

  .topbar{padding:26px 20px 6px;flex-shrink:0;}
  .topbar-row{display:flex;justify-content:space-between;align-items:flex-start;}
  .topbar-row .icon-btn{margin-top:-8px;margin-right:-8px;}
  .wordmark{font-size:13px;font-weight:700;letter-spacing:.16em;color:var(--text-faint);}
  .page-title{font-size:28px;font-weight:700;letter-spacing:-0.01em;margin:6px 0 2px;}
  .page-sub{font-size:13px;color:var(--text-dim);margin-bottom:18px;}

  .resume-banner{margin:0 20px 14px;padding:16px 18px;border-radius:14px;background:var(--text);color:var(--bg);display:flex;align-items:center;justify-content:space-between;border:none;width:calc(100% - 40px);text-align:left;}
  .resume-banner .rb-label{font-size:11px;font-weight:700;letter-spacing:.06em;opacity:.6;}
  .resume-banner .rb-name{font-size:15px;font-weight:700;margin-top:2px;}

  .day-list{padding:0 20px 8px;display:flex;flex-direction:column;gap:10px;}
  .day-card{display:flex;align-items:center;justify-content:space-between;padding:16px 8px 16px 18px;border:1px solid var(--border);border-radius:14px;background:var(--surface);}
  .day-main{background:none;border:none;text-align:left;flex:1;display:flex;flex-direction:column;gap:4px;padding:0;color:var(--text);}
  .day-name{font-size:16px;font-weight:700;}
  .day-meta{font-size:12.5px;color:var(--text-dim);}
  .day-actions{display:flex;align-items:center;gap:2px;flex-shrink:0;}
  .icon-btn{background:none;border:none;color:var(--text-dim);padding:9px;display:flex;align-items:center;justify-content:center;border-radius:10px;}
  .icon-btn:active{color:var(--text);background:var(--surface-2);}
  .icon-btn.tiny{padding:4px;}
  .icon-btn.danger:active{color:#fff;}
  .reorder-col{display:flex;flex-direction:column;gap:2px;flex-shrink:0;}

  .bottom-nav{display:flex;border-top:1px solid var(--border);background:var(--bg);flex-shrink:0;}
  .nav-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;padding:11px 0 15px;color:var(--text-faint);background:none;border:none;font-size:10.5px;font-weight:600;letter-spacing:.02em;}
  .nav-item.active{color:var(--text);}

  .section-label{padding:18px 20px 8px;font-size:11.5px;font-weight:700;letter-spacing:.08em;color:var(--text-faint);}
  .section-label-row{display:flex;align-items:center;justify-content:space-between;padding:10px 10px 4px 20px;}
  .section-label-row .section-label{padding:0;}

  .empty-state{margin:32px 20px;text-align:center;color:var(--text-dim);font-size:13px;line-height:1.5;padding:20px;}
  .empty-state strong{display:block;color:var(--text);font-size:15px;margin-bottom:6px;font-weight:700;}

  /* Workout screen */
  .workout-header{display:flex;align-items:center;gap:10px;padding:14px 14px 4px;flex-shrink:0;}
  .workout-header .wh-titles{flex:1;min-width:0;}
  .workout-title-input{background:none;border:none;font-size:17px;font-weight:700;width:100%;padding:0;}
  .workout-elapsed{font-size:12px;color:var(--text-dim);font-variant-numeric:tabular-nums;margin-top:1px;text-transform:uppercase;}
  .btn-finish{background:var(--text);color:var(--bg);border:none;padding:9px 16px;border-radius:999px;font-weight:700;font-size:13px;flex-shrink:0;}
  .btn-back{background:none;border:none;color:var(--text-dim);padding:8px;display:flex;flex-shrink:0;}

  .exercise-card{margin:10px 16px 0;border:1px solid var(--border);border-radius:14px;background:var(--surface);}
  .exercise-head{display:flex;align-items:center;gap:5px;padding:11px 8px 6px 10px;}
  .exercise-name-input{background:none;border:none;font-size:15px;font-weight:700;flex:1;padding:2px 0;min-width:0;}
  .exercise-name-input::placeholder{color:var(--text-faint);font-weight:600;}

  .set-table{padding:0 12px 4px;}
  .set-row{display:grid;grid-template-columns:20px 44px 1fr 1fr 76px;align-items:center;gap:6px;padding:7px 0;border-top:1px solid var(--border-soft);}
  .set-row-head{color:var(--text-faint);font-size:9.5px;letter-spacing:.05em;border-top:none;padding-bottom:4px;}
  .set-idx{font-weight:700;font-variant-numeric:tabular-nums;font-size:12px;color:var(--text-dim);}
  .set-prev{color:var(--text-faint);font-size:10.5px;font-variant-numeric:tabular-nums;}
  .set-input{background:var(--surface-2);border:1px solid var(--border);border-radius:9px;font-size:16px;font-weight:700;font-variant-numeric:tabular-nums;padding:11px 4px;width:100%;text-align:center;min-width:0;}
  .set-input::placeholder{color:var(--text-faint);font-weight:600;}
  .set-row.is-done .set-input{opacity:.45;}
  .set-actions{display:flex;align-items:center;gap:8px;justify-content:flex-end;}
  .set-check{width:34px;height:34px;border-radius:9px;border:1.5px solid var(--border);background:none;display:flex;align-items:center;justify-content:center;color:var(--bg);padding:0;flex-shrink:0;}
  .set-check.checked{background:var(--text);border-color:var(--text);}

  .add-set-btn{display:flex;align-items:center;gap:6px;justify-content:center;width:100%;margin:6px 0 4px;padding:9px;border:1px dashed var(--border);border-radius:10px;background:none;color:var(--text-dim);font-size:12px;font-weight:700;}
  .add-exercise-btn{display:flex;align-items:center;gap:6px;justify-content:center;width:calc(100% - 32px);margin:10px 16px 0;padding:13px;border:1px dashed var(--border);border-radius:12px;background:none;color:var(--text-dim);font-size:13px;font-weight:700;}
  .chooser-row{display:flex;gap:8px;margin:8px 16px 12px;}
  .chooser-btn{flex:1;padding:12px;border:1px solid var(--border);border-radius:12px;background:var(--surface-2);font-weight:700;font-size:12.5px;text-align:center;}

  .rest-row{display:flex;align-items:center;gap:8px;padding:9px 2px 5px;border-top:1px solid var(--border-soft);margin-top:2px;}
  .rest-row .rr-label{font-size:10px;color:var(--text-faint);letter-spacing:.06em;flex-shrink:0;}
  .rest-row .rr-time{font-size:13.5px;font-weight:800;font-variant-numeric:tabular-nums;flex:1;}
  .rest-row.is-active .rr-time{color:var(--text);}
  .rr-btn{background:var(--surface-2);border:1px solid var(--border);border-radius:999px;width:32px;height:32px;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:700;flex-shrink:0;padding:0;}
  .rr-skip{background:none;border:1px solid var(--border);border-radius:999px;padding:7px 12px;font-size:11.5px;font-weight:700;flex-shrink:0;}
  .rest-ring-mini{width:30px;height:30px;flex-shrink:0;}
  .rest-ring-mini circle{fill:none;stroke-width:3;}
  .rest-ring-mini .m-bg{stroke:var(--border);}
  .rest-ring-mini .m-fg{stroke:var(--text);stroke-linecap:round;transform:rotate(-90deg);transform-origin:50% 50%;}

  .running-card{margin:10px 16px 0;border:1px solid var(--border);border-radius:14px;background:var(--surface);padding:12px 14px 4px;}
  .running-title{font-size:15px;font-weight:700;display:flex;align-items:center;gap:8px;}
  .run-chip{flex:1;font-size:14px;font-weight:700;color:var(--text-dim);display:flex;align-items:center;gap:8px;}
  .running-grid{display:flex;gap:10px;margin:12px 0 14px;}
  .running-field{flex:1;display:flex;flex-direction:column;gap:6px;min-width:0;}
  .running-field label{font-size:10px;color:var(--text-faint);letter-spacing:.05em;}
  .running-field input{background:var(--surface-2);border:1px solid var(--border);border-radius:8px;font-size:14px;font-weight:700;padding:10px 4px;text-align:center;font-variant-numeric:tabular-nums;width:100%;}
  .running-pace{display:flex;align-items:baseline;justify-content:center;gap:6px;padding:8px 0 14px;border-top:1px solid var(--border-soft);}
  .pace-num{font-size:30px;font-weight:800;letter-spacing:-0.02em;font-variant-numeric:tabular-nums;}
  .pace-unit{font-size:12px;color:var(--text-dim);}

  .finish-bar{padding:16px 20px 24px;flex-shrink:0;}
  .btn-primary{background:var(--text);color:var(--bg);border:none;border-radius:999px;padding:15px;font-size:14px;font-weight:700;width:100%;}
  .btn-secondary{background:none;border:1px solid var(--border);color:var(--text);border-radius:999px;padding:14px;font-size:13px;font-weight:700;width:100%;margin-top:10px;}

  /* Day editor */
  .field-row{display:flex;align-items:center;gap:8px;padding:12px 8px 12px 12px;border:1px solid var(--border);border-radius:12px;background:var(--surface);margin:0 20px 10px;}
  .field-row input{flex:1;background:none;border:none;font-size:14px;font-weight:600;min-width:0;}
  .field-rest{display:flex;align-items:center;gap:4px;flex-shrink:0;}
  .field-rest span{font-size:10.5px;color:var(--text-dim);min-width:34px;text-align:center;font-variant-numeric:tabular-nums;text-transform:none;}

  /* History */
  .history-item{margin:0 20px 12px;padding:16px 18px;border:1px solid var(--border);border-radius:14px;background:var(--surface);display:flex;flex-direction:column;gap:6px;text-align:left;width:calc(100% - 40px);}
  .history-date{font-size:12px;color:var(--text-dim);}
  .history-day{font-size:15px;font-weight:700;}
  .history-stats{display:flex;gap:14px;font-size:12px;color:var(--text-dim);font-variant-numeric:tabular-nums;flex-wrap:wrap;}

  .detail-block{margin:0 20px 14px;border:1px solid var(--border);border-radius:14px;background:var(--surface);padding:14px 16px;}
  .detail-ex-name{font-size:14px;font-weight:700;margin-bottom:8px;}
  .detail-set-line{display:flex;justify-content:space-between;font-size:12.5px;color:var(--text-dim);padding:4px 0;font-variant-numeric:tabular-nums;}
  .detail-set-line span:first-child{color:var(--text-faint);}
  .detail-set-line.done span:last-child{color:var(--text);font-weight:700;}
  .detail-set-head{display:grid;grid-template-columns:18px 1fr 1fr 26px;gap:6px;color:var(--text-faint);font-size:9.5px;letter-spacing:.05em;padding-bottom:5px;}
  .detail-edit-set-row{display:grid;grid-template-columns:18px 1fr 1fr 26px;align-items:center;gap:6px;padding:5px 0;}
  .detail-edit-row{display:flex;justify-content:space-between;align-items:center;padding:6px 0;font-size:12px;color:var(--text-dim);}
  .detail-edit-row input{width:90px;}
  .danger-link{display:block;text-align:center;color:var(--text-dim);font-size:12.5px;font-weight:600;text-decoration:underline;padding:18px 20px 30px;background:none;border:none;width:100%;}
  .danger-link:active{color:var(--text);}

  /* Physique */
  .physique-wrap{display:flex;gap:16px;padding:4px 20px 6px;justify-content:center;}
  .physique-col{display:flex;flex-direction:column;align-items:center;gap:6px;}
  .physique-col svg{width:104px;height:auto;}
  .physique-caption{font-size:10px;color:var(--text-faint);letter-spacing:.06em;}
  .physique-legend{display:grid;grid-template-columns:1fr 1fr;gap:0 14px;padding:6px 20px 4px;}
  .legend-row{display:flex;justify-content:space-between;font-size:11.5px;color:var(--text-dim);border-bottom:1px solid var(--border-soft);padding:6px 0;}
  .legend-row span:last-child{color:var(--text);font-weight:700;font-variant-numeric:tabular-nums;}
  .legend-today{color:#43a047;font-weight:600;font-size:10px;}

  /* Calendar */
  .cal-wrap{margin:10px 20px 4px;border:1px solid var(--border);border-radius:14px;background:var(--surface);padding:11px 12px 12px;}
  .cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;}
  .cal-title{font-size:13px;font-weight:700;letter-spacing:.04em;}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;text-align:center;}
  .cal-dow{font-size:9px;color:var(--text-faint);padding-bottom:3px;}
  .cal-day{aspect-ratio:1;display:flex;align-items:center;justify-content:center;border-radius:7px;font-size:10.5px;font-weight:600;color:var(--text-dim);background:none;border:1px solid transparent;font-variant-numeric:tabular-nums;}
  .cal-day.today{border-color:var(--border);color:var(--text);}
  .cal-day.has-workout{background:var(--text);color:var(--bg);font-weight:800;}
  .cal-day.empty{visibility:hidden;}

  /* Modal */
  .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.78);display:flex;align-items:center;justify-content:center;z-index:50;padding:24px;}
  .modal-card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:18px;width:100%;max-width:340px;max-height:80vh;overflow-y:auto;}
  .modal-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px;}
  .modal-title{font-size:13.5px;font-weight:700;flex:1;min-width:0;}

  /* Nutrition */
  .nut-stats-row{display:flex;gap:8px;padding:0 20px 4px;align-items:stretch;}
  .nut-stat{flex:1;border:1px solid var(--border);border-radius:14px;background:var(--surface);padding:11px 6px;text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;}
  .nut-stat-label{font-size:9px;color:var(--text-faint);letter-spacing:.06em;}
  .nut-stat-value{font-size:15px;font-weight:800;font-variant-numeric:tabular-nums;display:flex;align-items:center;gap:4px;}
  .nut-edit-btn{flex-shrink:0;align-self:center;}

  .cal-hero{margin:12px 20px 4px;border:1px solid var(--border);border-radius:16px;background:var(--surface);padding:18px 18px 16px;}
  .cal-hero-top{display:flex;justify-content:space-between;align-items:center;gap:8px;}
  .cal-hero-num{font-size:32px;font-weight:800;letter-spacing:-0.02em;font-variant-numeric:tabular-nums;}
  .cal-hero-target{font-size:18px;font-weight:700;color:var(--text-dim);font-variant-numeric:tabular-nums;}
  .cal-hero-goal{font-size:11px;font-weight:700;letter-spacing:.06em;color:var(--text-dim);margin-top:3px;}
  .progress-track{height:8px;border-radius:999px;background:var(--surface-2);overflow:hidden;margin-top:12px;}
  .progress-fill{height:100%;background:var(--text);border-radius:999px;}
  .cal-hero-note{font-size:11px;color:var(--text-faint);margin-top:7px;font-variant-numeric:tabular-nums;}

  .macro-row{display:flex;gap:8px;padding:10px 20px 4px;}
  .macro-col{flex:1;border:1px solid var(--border);border-radius:12px;background:var(--surface);padding:10px 10px 11px;min-width:0;}
  .macro-label{font-size:9px;color:var(--text-faint);letter-spacing:.06em;margin-bottom:6px;}
  .macro-val{font-size:12px;font-weight:700;font-variant-numeric:tabular-nums;margin-bottom:7px;}
  .macro-track{height:5px;border-radius:999px;background:var(--surface-2);overflow:hidden;}
  .macro-fill{height:100%;background:var(--text);border-radius:999px;}

  .meal-block{margin:0 20px 12px;border:1px solid var(--border);border-radius:14px;background:var(--surface);overflow:hidden;}
  .meal-head{display:flex;justify-content:space-between;align-items:center;padding:14px 14px 10px;}
  .meal-title{font-size:12.5px;font-weight:700;letter-spacing:.06em;}
  .meal-kcal{font-size:12px;color:var(--text-dim);font-variant-numeric:tabular-nums;}
  .food-row{display:flex;flex-direction:column;gap:6px;padding:10px 14px;border-top:1px solid var(--border-soft);}
  .food-row-top{display:flex;justify-content:space-between;align-items:baseline;gap:8px;}
  .food-name{font-size:13px;font-weight:600;color:var(--text);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .food-kcal{font-size:12.5px;font-weight:700;font-variant-numeric:tabular-nums;flex-shrink:0;}
  .food-row-bottom{display:flex;justify-content:space-between;align-items:center;gap:8px;}
  .food-macros{font-size:10.5px;color:var(--text-faint);font-variant-numeric:tabular-nums;}
  .add-food-btn{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;min-height:48px;padding:14px 12px;border-top:1px dashed var(--border);background:none;color:var(--text-dim);font-size:12px;font-weight:700;}

  .lib-search{width:100%;background:var(--surface-2);border:1px solid var(--border);border-radius:10px;padding:10px 12px;font-size:13px;margin-bottom:10px;font-weight:600;}
  .lib-list{display:flex;flex-direction:column;gap:6px;max-height:280px;overflow-y:auto;margin-bottom:12px;}
  .lib-item{display:flex;align-items:center;gap:2px;border:1px solid var(--border);border-radius:10px;background:var(--surface-2);}
  .lib-item-main{flex:1;min-width:0;background:none;border:none;text-align:left;padding:10px 4px 10px 12px;display:flex;flex-direction:column;gap:3px;color:var(--text);}
  .lib-item-name{font-size:12.5px;font-weight:700;}
  .lib-item-tag{color:var(--text-faint);font-weight:600;}
  .lib-item-macro{font-size:10px;color:var(--text-faint);font-variant-numeric:tabular-nums;}
  .lib-empty{padding:18px 4px;text-align:center;color:var(--text-faint);font-size:12px;}
  .modal-btn-row{display:flex;gap:8px;}

  .form-field{margin-bottom:10px;}
  .form-field label{display:block;font-size:9.5px;color:var(--text-faint);letter-spacing:.05em;margin-bottom:5px;}
  .form-field input,.form-field select{width:100%;background:var(--surface-2);border:1px solid var(--border);border-radius:9px;padding:10px 11px;font-size:13px;font-weight:600;-webkit-appearance:none;appearance:none;}
  .form-grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;}
  .form-grid4{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:6px;}
  .segmented{display:flex;gap:6px;}
  .seg-btn{flex:1;padding:10px 4px;border:1px solid var(--border);border-radius:10px;background:var(--surface-2);font-size:11px;font-weight:700;text-align:center;color:var(--text-dim);}
  .seg-btn.active{background:var(--text);color:var(--bg);border-color:var(--text);}
  .lib-check-row{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--text-dim);padding:2px 2px 14px;font-weight:600;}
  .lib-check-row input{width:16px;height:16px;flex-shrink:0;}

  .mealbuilder-comp{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px 11px;border:1px solid var(--border);border-radius:99px;background:var(--surface-2);margin-bottom:6px;}
  .mb-comp-name{font-size:12.5px;font-weight:700;}
  .mb-comp-macro{font-size:10px;color:var(--text-faint);margin-top:2px;font-variant-numeric:tabular-nums;}

  .slider-row{margin-bottom:18px;}
  .slider-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:9px;}
  .slider-label{font-size:11px;font-weight:700;letter-spacing:.05em;color:var(--text-dim);}
  .slider-val{font-size:15px;font-weight:800;font-variant-numeric:tabular-nums;}
  input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:3px;border-radius:999px;background:var(--surface-2);outline:none;margin:0;}
  input[type=range]::-webkit-slider-runnable-track{height:3px;border-radius:999px;background:transparent;}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:15px;height:15px;border-radius:50%;background:var(--text);border:none;margin-top:-6px;}
  input[type=range]::-moz-range-track{height:3px;border-radius:999px;background:var(--surface-2);}
  input[type=range]::-moz-range-progress{height:3px;border-radius:999px;background:var(--text);}
  input[type=range]::-moz-range-thumb{width:15px;height:15px;border-radius:50%;background:var(--text);border:none;}

  ::-webkit-scrollbar{display:none;}
</style>
</head>
<body>
<div id="app-root"><div class="app" id="app"></div></div>

<script>
(function(){
  "use strict";

  /* ---------- icons ---------- */
  const ICON_CHEVRON_RIGHT = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>';
  const ICON_BACK = '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>';
  const ICON_PLUS = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>';
  const ICON_TRASH = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"></path><path d="M10 11v6"></path><path d="M14 11v6"></path><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"></path></svg>';
  const ICON_PENCIL = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 3a2.83 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z"></path></svg>';
  const ICON_CHECK = '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>';
  const ICON_X = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>';
  const ICON_DUMBBELL = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6.5 6.5v11M17.5 6.5v11M3 9v6M21 9v6M6.5 12h11"></path></svg>';
  const ICON_CLOCK = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"></circle><polyline points="12 7 12 12 16 14"></polyline></svg>';
  const ICON_RUN = '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="15.5" cy="5" r="1.6"></circle><path d="M13 22l1.5-6-2-1.5.5-5 3 2.5 2 1 2.5 1M8 22l3-6-2.5-3M4.5 12L9 10.5l2 -3"></path></svg>';
  const ICON_UP = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="18 15 12 9 6 15"></polyline></svg>';
  const ICON_DOWN = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>';
  const ICON_CHART = '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 17 9 11 13 15 21 6"></polyline><polyline points="14 6 21 6 21 13"></polyline></svg>';
  const ICON_APPLE = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 6c1-2 3-3 5-2.5"></path><path d="M17.5 8.5c2.5 1.5 3 6-1 10.5-1.5 1.7-3 2-4.5 2s-3-.3-4.5-2c-4-4.5-3.5-9 0-10.7C9 7 10.3 6.6 12 7.3c1.7-.7 3-.3 5.5 1.2z"></path></svg>';
  const ICON_FLAME = '<svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor" stroke="none"><path d="M12 2c1 3-3 4.5-3 8a3 3 0 1 0 6 0c1.5 1 2 3 2 4.5A5.5 5.5 0 0 1 6.5 20 5.5 5.5 0 0 1 5 12.5C5 8 9 6 12 2z"></path></svg>';
  const ICON_GEAR = '<svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>';
  const ICON_DIARY = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="18" rx="2"></rect><line x1="8" y1="8" x2="16" y2="8"></line><line x1="8" y1="12" x2="16" y2="12"></line><line x1="8" y1="16" x2="13" y2="16"></line></svg>';

  /* ---------- utils ---------- */
  const uid = () => 'id' + Date.now().toString(36) + Math.random().toString(36).slice(2,8);
  const escAttr = (s) => String(s==null?'':s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');
  const escHtml = (s) => String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  const pad2 = (n) => String(n).padStart(2,'0');
  const secToClock = (sec) => { sec = Math.max(0, Math.round(sec)); const h = Math.floor(sec/3600), m = Math.floor((sec%3600)/60), s = sec%60; return h>0 ? `${h}:${pad2(m)}:${pad2(s)}` : `${m}:${pad2(s)}`; };
  const secToMMSS = (sec) => { sec = Math.max(0, Math.round(sec)); return `${Math.floor(sec/60)}:${pad2(sec%60)}`; };
  const mmssToSec = (str) => { if(!str) return 0; str = String(str).trim(); if(str.indexOf(':')>-1){ const p = str.split(':').map(Number); return (p[0]||0)*60 + (p[1]||0); } return Math.round((Number(str)||0)*60); };
  const trimNum = (n) => { n = Number(n); if(!isFinite(n)) return '0'; return (Math.round(n*100)/100).toString(); };
  const formatTime24 = (ts) => { const d = new Date(ts); return pad2(d.getHours())+':'+pad2(d.getMinutes()); };
  const toDateStr = (ts) => { const d = new Date(ts); return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate()); };
  const fmtDate = (ts) => new Date(ts).toLocaleDateString(undefined,{weekday:'short', day:'numeric', month:'short'});
  const fmtShortDate = (ds) => { const [y,m,d] = ds.split('-').map(Number); return d+'/'+m; };

  const ROMAN_MAP = {1:'I',2:'II',3:'III',4:'IV',5:'V',6:'VI',7:'VII',8:'VIII',9:'IX',10:'X'};
  function numDisplay(n){
    const num = Number(n);
    if(!isFinite(num)) return String(n);
    if(Number.isInteger(num) && num>=1 && num<=10) return ROMAN_MAP[num];
    return trimNum(num);
  }

  /* ---------- preset templates ---------- */
  /* rest defaults: 105 = 1:45 (isolation), 135 = 2:15 (compound) */
  const PRESET_TEMPLATES = {
    mon:  [['LATERAL RAISE',2,105],['BICEP CURL',2,105],['CLOSE GRIP BENCH PRESS',2,135],['LATISSIMUS PULL',2,135],['HAMMIES CURL',2,105],['CALVE RAISE',2,105]],
    tues: [['INCLINE PRESS',3,135],['PULLUP',3,135],['LATERAL RAISE',2,105],['QUADRICEP PRESS',2,135],['BULGARIAN SPLIT',2,135]],
    wed:  [['CLOSE GRIP BENCH PRESS',3,135],['INCLINE CURL',2,105],['TRICEP  EXTENSION',2,105],['LATISSIMUS ROW',2,135],['HAMMIES CURL',3,105]],
    thurs:[['LATISSIMUS PULLDOWN',2,135],['LATISSIMUS ROW',2,135],['BICEP CURL',2,105],['LATERAL RAISE',2,105],['QUADRICEP PRESS',2,135],['BULGARIAN SPLIT',2,135]],
    fri:  [['INCLINE PRESS',3,135],['LATERAL RAISE',3,105],['LATISSIMUS ROW',2,135],['HAMMIES CURL',2,105],['CALVE RAISE',2,105]],
    sat:  [],
    sun:  [['PULLUPS',3,135],['CHEST SUPPORT ROW',3,135],['LATERAL RAISE',2,105],['BICEP CURL',2,105],['TRICEP EXTENSION',2,105]]
  };

  /* ---------- nutrition ---------- */
  const MEAL_SLOTS = [['breakfast','BREAKFAST'],['lunch','LUNCH'],['dinner','DINNER'],['snacks','SNACKS'],['dessert','DESSERT']];
  function mealLabel(id){ const m = MEAL_SLOTS.find(x => x[0]===id); return m ? m[1] : String(id||'').toUpperCase(); }
  function defaultNutrition(){
    return {
      profile: {
        heightCm: 183,
        weightKg: 76.2,
        calorieTarget: 2450,
        goal: 'LEAN BULK',
        rateNote: '0.05–0.1 KG/WEEK',
        macros: { protein: 150, carbs: 275, fat: 95 },
        sleepHours: null
      },
      library: [],
      log: {}
    };
  }

  /* ---------- default state ---------- */
  function defaultState(){
    const labels = ['MON','TUES','WED','THURS','FRI','SAT','SUN'];
    return {
      days: labels.map(l => {
        const id = l.toLowerCase();
        const preset = PRESET_TEMPLATES[id] || [];
        return { id, name:l, items: preset.map(([nm,sets,rest]) => ({ id:uid(), itemType:'exercise', name:nm, restSeconds:rest||105, defaultSets:sets })) };
      }),
      history: [],
      active: null,
      nutrition: defaultNutrition(),
      manualMuscleLog: [],
      settings: { restShortcutEnabled:false, restShortcutName:'Rest Timer' }
    };
  }

  let state = null;
  let view = { screen:'home', dayEditId:null, historyId:null, chooserOpen:null, cal:{ year:new Date().getFullYear(), month:new Date().getMonth() }, progressModalExId:null, nutModal:null, nutSearchQuery:'', mealBuilder:null, settingsModal:false, muscleLogOpen:false };
  let restTimers = {}; // itemId -> {total, remaining, running, intervalId}

  /* ---------- persistence ---------- */
  const STORE_KEY = 'fitness_tracker_state_v4';
  const STORAGE_BACKEND = (typeof window !== 'undefined' && window.storage && typeof window.storage.get === 'function') ? 'artifact' : 'local';
  async function storageGet(key){
    if(STORAGE_BACKEND === 'artifact'){
      try{ return await window.storage.get(key, false); }catch(e){ return null; }
    }
    try{ const raw = localStorage.getItem(key); return raw ? { value: raw } : null; }catch(e){ return null; }
  }
  async function storageSet(key, value){
    if(STORAGE_BACKEND === 'artifact'){
      try{ await window.storage.set(key, value, false); }catch(e){ /* best effort */ }
      return;
    }
    try{ localStorage.setItem(key, value); }catch(e){ /* best effort */ }
  }
  async function loadState(){
    try{
      const res = await storageGet(STORE_KEY);
      if(res && res.value){
        const parsed = JSON.parse(res.value);
        if(parsed && Array.isArray(parsed.days) && parsed.days.length===7 && Array.isArray(parsed.days[0].items)){
          state = parsed;
          const dn = defaultNutrition();
          if(!state.nutrition) state.nutrition = dn;
          if(!Array.isArray(state.nutrition.library)) state.nutrition.library = [];
          if(!state.nutrition.log || typeof state.nutrition.log !== 'object') state.nutrition.log = {};
          if(!state.nutrition.profile) state.nutrition.profile = dn.profile;
          if(!state.nutrition.profile.macros) state.nutrition.profile.macros = dn.profile.macros;
          if(state.nutrition.profile.sleepHours === undefined) state.nutrition.profile.sleepHours = null;
          if(!Array.isArray(state.manualMuscleLog)) state.manualMuscleLog = [];
          if(!state.settings) state.settings = { restShortcutEnabled:false, restShortcutName:'Rest Timer' };
          return;
        }
      }
    }catch(e){ /* not found or unavailable */ }
    state = defaultState();
  }
  let saveTimer = null;
  function saveState(immediate){
    clearTimeout(saveTimer);
    if(immediate){ storageSet(STORE_KEY, JSON.stringify(state)); return; }
    saveTimer = setTimeout(() => { storageSet(STORE_KEY, JSON.stringify(state)); }, 150);
  }

  /* ---------- data helpers ---------- */
  function getDay(id){ return state.days.find(d => d.id === id); }
  function findItemInActive(id){ return state.active.items.find(i => i.id === id); }

  function findPreviousSetsForDay(dayId, exerciseName){
    if(!exerciseName || !exerciseName.trim()) return null;
    const name = exerciseName.trim().toLowerCase();
    const sorted = state.history.filter(h => h.dayId === dayId).sort((a,b) => b.endedAt - a.endedAt);
    for(const session of sorted){
      const ex = session.items.find(i => i.itemType==='exercise' && (i.name||'').trim().toLowerCase() === name);
      if(ex && ex.sets && ex.sets.length) return ex.sets;
    }
    return null;
  }

  function extractNumber(raw){
    if(raw == null) return null;
    const s = String(raw).trim().replace(/,/g, '');
    const m = s.match(/-?\d+(\.\d+)?/);
    return m ? Number(m[0]) : null;
  }
  function parseHoursFlexible(raw){
    if(raw == null) return null;
    const s = String(raw).trim();
    if(/^\d+(\.\d+)?$/.test(s)) return Number(s);
    let m = s.match(/^(\d+):(\d{1,2})/);
    if(m) return Number(m[1]) + Number(m[2])/60;
    const hMatch = s.match(/(\d+(?:\.\d+)?)\s*h/i);
    const mMatch = s.match(/(\d+(?:\.\d+)?)\s*m/i);
    if(hMatch || mMatch) return (hMatch?Number(hMatch[1]):0) + (mMatch?Number(mMatch[1]):0)/60;
    const n = Number(s.replace(/,/g,''));
    if(isFinite(n)) return n;
    return extractNumber(s);
  }
  function fmtHoursDecimal(hoursDecimal){
    return (Math.round(Number(hoursDecimal)*10)/10).toFixed(1) + ' H';
  }

  function nutToday(){ return toDateStr(Date.now()); }
  function getDayLog(ds){
    if(!state.nutrition.log[ds]) state.nutrition.log[ds] = { breakfast:[], lunch:[], dinner:[], snacks:[], dessert:[] };
    const d = state.nutrition.log[ds];
    MEAL_SLOTS.forEach(([id]) => { if(!Array.isArray(d[id])) d[id] = []; });
    return d;
  }
  function dayHasEntries(ds){
    const d = state.nutrition.log[ds];
    if(!d) return false;
    return MEAL_SLOTS.some(([id]) => Array.isArray(d[id]) && d[id].length > 0);
  }
  function computeDayTotals(ds){
    const totals = { cals:0, protein:0, carbs:0, fat:0 };
    const d = state.nutrition.log[ds];
    if(!d) return totals;
    MEAL_SLOTS.forEach(([id]) => {
      (d[id]||[]).forEach(e => {
        const q = e.qty || 1;
        totals.cals += (e.cals||0)*q; totals.protein += (e.protein||0)*q;
        totals.carbs += (e.carbs||0)*q; totals.fat += (e.fat||0)*q;
      });
    });
    return totals;
  }
  function computeStreak(){
    let count = 0;
    const cursor = new Date();
    if(!dayHasEntries(toDateStr(cursor.getTime()))) cursor.setDate(cursor.getDate()-1);
    while(true){
      const ds = toDateStr(cursor.getTime());
      if(dayHasEntries(ds)){ count++; cursor.setDate(cursor.getDate()-1); } else break;
    }
    return count;
  }

  function moveItem(arr, id, dir){
    const idx = arr.findIndex(i => i.id === id);
    if(idx<0) return;
    const newIdx = idx+dir;
    if(newIdx<0 || newIdx>=arr.length) return;
    const [it] = arr.splice(idx,1);
    arr.splice(newIdx,0,it);
  }

  function clearAllRestTimers(){
    Object.keys(restTimers).forEach(id => { if(restTimers[id].intervalId) clearInterval(restTimers[id].intervalId); });
    restTimers = {};
  }

  function startWorkout(dayId){
    const day = getDay(dayId);
    if(!day) return;
    if(state.active && state.active.dayId !== dayId){
      if(!confirm('You have a workout already in progress for "' + state.active.dayName + '". Starting this one will discard it. Continue?')) return;
    }
    if(state.active && state.active.dayId === dayId){
      view.screen = 'workout';
      render();
      return;
    }
    state.active = {
      dayId: day.id,
      dayName: day.name,
      startedAt: Date.now(),
      items: day.items.map(it => {
        if(it.itemType === 'run') return { id: uid(), itemType:'run', distanceKm:'', durationSec:0 };
        const prev = findPreviousSetsForDay(day.id, it.name);
        const sets = (prev && prev.length)
          ? prev.map(s => ({ id: uid(), reps: s.reps, weight: s.weight, completed:false }))
          : Array.from({length: Math.max(1, it.defaultSets||1)}, () => ({ id: uid(), reps:'', weight:'', completed:false }));
        return { id: uid(), itemType:'exercise', name: it.name, restSeconds: it.restSeconds||105, sets };
      })
    };
    view.screen = 'workout';
    saveState();
    render();
  }

  function discardWorkout(){
    if(!confirm('Discard this workout? Nothing will be saved.')) return;
    state.active = null;
    clearAllRestTimers();
    view.screen = 'home';
    saveState();
    render();
  }

  function finishWorkout(){
    const a = state.active;
    if(!a) return;
    const cleanItems = a.items.map(it => {
      if(it.itemType === 'run') return { itemType:'run', distanceKm: Number(it.distanceKm)||0, durationSec: it.durationSec||0 };
      return { itemType:'exercise', name: it.name, sets: it.sets.filter(s => s.completed || s.reps !== '' || s.weight !== '') };
    }).filter(it => it.itemType==='run' ? (it.distanceKm>0 || it.durationSec>0) : (it.name.trim()!=='' || it.sets.length>0));
    const entry = {
      id: uid(),
      dayId: a.dayId,
      dayName: a.dayName || 'Workout',
      date: toDateStr(a.startedAt),
      endedAt: Date.now(),
      startedAt: a.startedAt,
      durationSec: Math.round((Date.now() - a.startedAt)/1000),
      items: cleanItems
    };
    state.history.unshift(entry);
    state.active = null;
    clearAllRestTimers();
    view.screen = 'historyDetail';
    view.historyId = entry.id;
    saveState();
    render();
  }

  /* ---------- rest timers (per exercise) ---------- */
  function triggerRestShortcut(seconds){
    if(!state.settings || !state.settings.restShortcutEnabled) return;
    const name = state.settings.restShortcutName || 'Rest Timer';
    const url = 'shortcuts://run-shortcut?name=' + encodeURIComponent(name) + '&input=text&text=' + encodeURIComponent(String(Math.round(seconds)));
    try{ window.location.href = url; }catch(e){ /* scheme unsupported, ignore */ }
  }
  function startRestTimerFor(exId, seconds){
    if(restTimers[exId] && restTimers[exId].intervalId) clearInterval(restTimers[exId].intervalId);
    restTimers[exId] = { total: seconds, remaining: seconds, running: true, intervalId: null };
    restTimers[exId].intervalId = setInterval(() => {
      const t = restTimers[exId];
      if(!t) return;
      t.remaining -= 1;
      if(t.remaining <= 0){
        clearInterval(t.intervalId);
        delete restTimers[exId];
        refreshRestRow(exId);
        return;
      }
      tickRestRow(exId);
    }, 1000);
  }
  function stopRestTimerFor(exId){
    const t = restTimers[exId];
    if(t && t.intervalId) clearInterval(t.intervalId);
    delete restTimers[exId];
  }
  function tickRestRow(exId){
    const t = restTimers[exId];
    if(!t) return;
    const timeEl = document.getElementById('rest-time-'+exId);
    if(timeEl) timeEl.textContent = secToMMSS(t.remaining);
    const row = document.getElementById('rest-row-'+exId);
    if(row){
      const fg = row.querySelector('.m-fg');
      if(fg){ const r=11, c=2*Math.PI*r; const frac = t.total>0 ? t.remaining/t.total : 0; fg.setAttribute('stroke-dashoffset', c*(1-frac)); }
    }
  }
  function refreshRestRow(exId){
    const row = document.getElementById('rest-row-'+exId);
    if(!row || !state.active) return;
    const item = findItemInActive(exId);
    if(!item) return;
    row.outerHTML = renderRestRow(item);
  }
  function renderRestRow(ex){
    const t = restTimers[ex.id];
    if(t && t.running){
      const r=11, c=2*Math.PI*r;
      const frac = t.total>0 ? t.remaining/t.total : 0;
      const offset = c*(1-frac);
      return `<div class="rest-row is-active" id="rest-row-${ex.id}">
        <svg class="rest-ring-mini" viewBox="0 0 26 26"><circle class="m-bg" cx="13" cy="13" r="${r}"></circle><circle class="m-fg" cx="13" cy="13" r="${r}" stroke-dasharray="${c}" stroke-dashoffset="${offset}"></circle></svg>
        <div class="rr-label">Rest</div>
        <div class="rr-time" id="rest-time-${ex.id}">${secToMMSS(t.remaining)}</div>
        <button class="rr-btn" data-action="rest-adjust" data-ex="${ex.id}" data-delta="-15">−</button>
        <button class="rr-btn" data-action="rest-adjust" data-ex="${ex.id}" data-delta="15">+</button>
        <button class="rr-skip" data-action="rest-skip" data-ex="${ex.id}">Skip</button>
      </div>`;
    }
    return `<div class="rest-row" id="rest-row-${ex.id}">
      <div class="rr-label">Rest</div>
      <div class="rr-time">${secToMMSS(ex.restSeconds||105)}</div>
      <button class="rr-btn" data-action="rest-adjust" data-ex="${ex.id}" data-delta="-15">−</button>
      <button class="rr-btn" data-action="rest-adjust" data-ex="${ex.id}" data-delta="15">+</button>
    </div>`;
  }

  /* ---------- muscle classification for physique map ---------- */
  const MUSCLE_DB = [
    { re:/reverse\s*fl(y|ies|ye)|rear\s*(delt|fly)/i, primary:'shoulders', secondary:'back' },
    { re:/bench|chest press|push[- ]?up|press[- ]?up|dip/i, primary:'chest', secondary:['triceps','shoulders'] },
    { re:/incline\s*(press|bench)|decline\s*(press|bench)/i, primary:'chest', secondary:['shoulders','triceps'] },
    { re:/\bfly\b|\bflye\b/i, primary:'chest', secondary:'shoulders' },
    { re:/overhead press|shoulder press|military press|arnold/i, primary:'shoulders', secondary:'triceps' },
    { re:/lateral raise|front raise|upright row/i, primary:'shoulders', secondary:null },
    { re:/face pull/i, primary:'shoulders', secondary:'back' },
    { re:/leg curl|hamstring|hammies/i, primary:'hamstrings', secondary:null },
    { re:/hip thrust|glute bridge|glute/i, primary:'glutes', secondary:'hamstrings' },
    { re:/calf|calv/i, primary:'calves', secondary:null },
    { re:/row|pulldown|pull[- ]?up|chin[- ]?up|latissimus|\blat\b/i, primary:'back', secondary:'biceps' },
    { re:/deadlift/i, primary:'back', secondary:['hamstrings','glutes'] },
    { re:/shrug/i, primary:'back', secondary:null },
    { re:/squat|leg press|lunge|bulgarian|split|quad/i, primary:'quads', secondary:'glutes' },
    { re:/leg extension/i, primary:'quads', secondary:null },
    { re:/curl/i, primary:'biceps', secondary:null },
    { re:/tricep|pushdown|skull[- ]?crusher|extension/i, primary:'triceps', secondary:null },
    { re:/plank|crunch|sit[- ]?up|\babs?\b|core/i, primary:'abs', secondary:null }
  ];
  function classifyExercise(name){
    if(!name) return null;
    for(const rule of MUSCLE_DB){ if(rule.re.test(name)) return rule; }
    return null;
  }
  function getWeekRange(){
    const now = new Date();
    const dow = (now.getDay()+6)%7; // Monday=0 ... Sunday=6
    const monday = new Date(now.getFullYear(), now.getMonth(), now.getDate()-dow);
    const sunday = new Date(monday.getFullYear(), monday.getMonth(), monday.getDate()+6);
    return { start: toDateStr(monday.getTime()), end: toDateStr(sunday.getTime()) };
  }
  const MUSCLE_GROUPS = ['chest','shoulders','biceps','triceps','back','abs','glutes','hamstrings','quads','calves'];
  function computeMuscleTotals(inRange){
    const totals = {chest:0,shoulders:0,biceps:0,triceps:0,abs:0,back:0,glutes:0,hamstrings:0,quads:0,calves:0};
    state.history.forEach(h => {
      if(!inRange(h.date)) return;
      h.items.forEach(it => {
        if(it.itemType !== 'exercise') return;
        const rule = classifyExercise(it.name);
        if(!rule) return;
        const completed = it.sets.filter(s => s.completed).length;
        if(completed <= 0) return;
        totals[rule.primary] += completed * 1;
        const secondaries = Array.isArray(rule.secondary) ? rule.secondary : (rule.secondary ? [rule.secondary] : []);
        secondaries.forEach(sec => { totals[sec] += completed * 0.5; });
      });
    });
    (state.manualMuscleLog||[]).forEach(m => {
      if(!inRange(m.date)) return;
      if(totals[m.muscle] !== undefined) totals[m.muscle] += Number(m.sets)||0;
    });
    return totals;
  }
  function computePhysique(){
    const { start, end } = getWeekRange();
    return computeMuscleTotals(d => d >= start && d <= end);
  }
  function computeTodayMuscleTotals(){
    const today = toDateStr(Date.now());
    return computeMuscleTotals(d => d === today);
  }
  function tierFill(v){
    if(v <= 0) return 'none';
    if(v <= 4) return 'rgba(245,244,241,0.28)';
    if(v < 8) return 'rgba(245,244,241,0.62)';
    return 'rgba(245,244,241,0.97)';
  }
  function bodySvg(side, f){
    if(side === 'front'){
      return `<svg viewBox="0 0 120 200" xmlns="http://www.w3.org/2000/svg">
        <circle cx="60" cy="16" r="13" style="fill:var(--surface-2);stroke:var(--border);stroke-width:1"/>
        <rect x="27" y="32" width="18" height="12" rx="6" style="fill:${f('shoulders')};stroke:var(--border)"/>
        <rect x="75" y="32" width="18" height="12" rx="6" style="fill:${f('shoulders')};stroke:var(--border)"/>
        <rect x="40" y="32" width="40" height="26" rx="8" style="fill:${f('chest')};stroke:var(--border)"/>
        <rect x="17" y="46" width="14" height="30" rx="6" style="fill:${f('biceps')};stroke:var(--border)"/>
        <rect x="89" y="46" width="14" height="30" rx="6" style="fill:${f('biceps')};stroke:var(--border)"/>
        <rect x="42" y="60" width="36" height="34" rx="8" style="fill:${f('abs')};stroke:var(--border)"/>
        <rect x="36" y="96" width="20" height="48" rx="8" style="fill:${f('quads')};stroke:var(--border)"/>
        <rect x="64" y="96" width="20" height="48" rx="8" style="fill:${f('quads')};stroke:var(--border)"/>
        <rect x="36" y="146" width="20" height="42" rx="8" style="fill:none;stroke:var(--border)"/>
        <rect x="64" y="146" width="20" height="42" rx="8" style="fill:none;stroke:var(--border)"/>
      </svg>`;
    }
    return `<svg viewBox="0 0 120 200" xmlns="http://www.w3.org/2000/svg">
      <circle cx="60" cy="16" r="13" style="fill:var(--surface-2);stroke:var(--border);stroke-width:1"/>
      <rect x="38" y="32" width="44" height="12" rx="6" style="fill:${f('back')};stroke:var(--border)"/>
      <rect x="38" y="44" width="44" height="44" rx="8" style="fill:${f('back')};stroke:var(--border)"/>
      <rect x="17" y="46" width="14" height="30" rx="6" style="fill:${f('triceps')};stroke:var(--border)"/>
      <rect x="89" y="46" width="14" height="30" rx="6" style="fill:${f('triceps')};stroke:var(--border)"/>
      <rect x="40" y="90" width="40" height="22" rx="10" style="fill:${f('glutes')};stroke:var(--border)"/>
      <rect x="36" y="114" width="20" height="38" rx="8" style="fill:${f('hamstrings')};stroke:var(--border)"/>
      <rect x="64" y="114" width="20" height="38" rx="8" style="fill:${f('hamstrings')};stroke:var(--border)"/>
      <rect x="36" y="156" width="20" height="38" rx="8" style="fill:${f('calves')};stroke:var(--border)"/>
      <rect x="64" y="156" width="20" height="38" rx="8" style="fill:${f('calves')};stroke:var(--border)"/>
    </svg>`;
  }
  function renderPhysique(){
    const totals = computePhysique();
    const todayTotals = computeTodayMuscleTotals();
    const f = (region) => tierFill(totals[region]);
    const legend = MUSCLE_GROUPS.map(r => {
      const todayAdd = todayTotals[r] > 0 ? ` <span class="legend-today">+${trimNum(todayTotals[r])}</span>` : '';
      return `<div class="legend-row"><span>${r}</span><span>${trimNum(totals[r])}${todayAdd}</span></div>`;
    }).join('');
    return `
      <div class="section-label-row">
        <div class="section-label">Muscle load — this week</div>
        <button class="icon-btn" data-action="open-muscle-log">${ICON_PENCIL}</button>
      </div>
      <div class="physique-wrap">
        <div class="physique-col">${bodySvg('front', f)}<div class="physique-caption">Front</div></div>
        <div class="physique-col">${bodySvg('back', f)}<div class="physique-caption">Back</div></div>
      </div>
      <div class="physique-legend">${legend}</div>`;
  }

  /* ---------- exercise progress chart ---------- */
  function getExerciseHistory(name){
    const target = (name||'').trim().toLowerCase();
    if(!target) return [];
    const points = [];
    state.history.forEach(h => {
      h.items.forEach(it => {
        if(it.itemType === 'exercise' && (it.name||'').trim().toLowerCase() === target){
          const weights = it.sets.filter(s=>s.completed).map(s=>Number(s.weight)||0);
          if(weights.length) points.push({ date:h.date, endedAt:h.endedAt, weight: Math.max(...weights) });
        }
      });
    });
    points.sort((a,b) => a.endedAt - b.endedAt);
    return points;
  }
  function renderProgressModal(){
    if(!view.progressModalExId || !state.active) return '';
    const item = findItemInActive(view.progressModalExId);
    if(!item) return '';
    const name = item.name;
    const pts = getExerciseHistory(name);
    let body;
    if(pts.length === 0){
      body = `<div class="empty-state" style="margin:8px 0;padding:14px;"><strong>No history yet</strong>Log a completed set for this exercise to start tracking it.</div>`;
    } else {
      const w=280, h=150, padL=32, padR=14, padT=14, padB=22;
      const weights = pts.map(p=>p.weight);
      const minW = Math.min(...weights), maxW = Math.max(...weights);
      const range = (maxW-minW) || 1;
      const stepX = pts.length>1 ? (w-padL-padR)/(pts.length-1) : 0;
      const coords = pts.map((p,i) => ({ x: padL+stepX*i, y: padT+(h-padT-padB)*(1-(p.weight-minW)/range), p }));
      const linePath = coords.map((c,i) => (i===0?'M':'L')+c.x.toFixed(1)+','+c.y.toFixed(1)).join(' ');
      const dots = coords.map(c => `<circle cx="${c.x.toFixed(1)}" cy="${c.y.toFixed(1)}" r="3.5" fill="var(--text)"></circle>`).join('');
      const labels = coords.map(c => `<text x="${c.x.toFixed(1)}" y="${h-6}" font-size="8" fill="var(--text-faint)" text-anchor="middle">${fmtShortDate(c.p.date)}</text>`).join('');
      const maxLabel = `<text x="${padL-5}" y="${padT+4}" font-size="8" fill="var(--text-faint)" text-anchor="end">${trimNum(maxW)}</text>`;
      const minLabel = `<text x="${padL-5}" y="${h-padB+2}" font-size="8" fill="var(--text-faint)" text-anchor="end">${trimNum(minW)}</text>`;
      body = `<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:auto;">
          <line x1="${padL}" y1="${padT}" x2="${padL}" y2="${h-padB}" stroke="var(--border)"></line>
          <line x1="${padL}" y1="${h-padB}" x2="${w-padR}" y2="${h-padB}" stroke="var(--border)"></line>
          <path d="${linePath}" fill="none" stroke="var(--text)" stroke-width="2"></path>
          ${dots}${labels}${maxLabel}${minLabel}
        </svg>`;
    }
    return `<div class="modal-overlay">
      <div class="modal-card">
        <div class="modal-head">
          <div class="modal-title">${escHtml(name || 'Exercise')} — Progress (kg)</div>
          <button class="icon-btn" data-action="close-progress">${ICON_X}</button>
        </div>
        ${body}
      </div>
    </div>`;
  }

  /* ---------- calendar ---------- */
  function renderCalendar(){
    const { year, month } = view.cal;
    const first = new Date(year, month, 1);
    const startIdx = (first.getDay()+6)%7;
    const totalDays = new Date(year, month+1, 0).getDate();
    const monthName = first.toLocaleDateString(undefined,{month:'long'});
    const todayDs = toDateStr(Date.now());
    const historyDates = new Set(state.history.map(h => h.date));
    let cells = '';
    for(let i=0;i<startIdx;i++) cells += '<div class="cal-day empty"></div>';
    for(let d=1; d<=totalDays; d++){
      const ds = year+'-'+pad2(month+1)+'-'+pad2(d);
      const has = historyDates.has(ds);
      const isToday = ds === todayDs;
      cells += `<button class="cal-day ${isToday?'today':''} ${has?'has-workout':''}" ${has?`data-action="open-calendar-day" data-date="${ds}"`:''}>${d}</button>`;
    }
    return `
      <div class="cal-wrap">
        <div class="cal-head">
          <button class="icon-btn" data-action="cal-prev">${ICON_BACK}</button>
          <div class="cal-title">${monthName} ${year}</div>
          <button class="icon-btn" data-action="cal-next">${ICON_CHEVRON_RIGHT}</button>
        </div>
        <div class="cal-grid">
          <div class="cal-dow">Mon</div><div class="cal-dow">Tue</div><div class="cal-dow">Wed</div><div class="cal-dow">Thu</div><div class="cal-dow">Fri</div><div class="cal-dow">Sat</div><div class="cal-dow">Sun</div>
          ${cells}
        </div>
      </div>`;
  }

  /* ---------- render: HOME ---------- */
  function renderHome(){
    let resumeHtml = '';
    if(state.active){
      resumeHtml = `
      <button class="resume-banner" data-action="goto-workout">
        <div>
          <div class="rb-label">In progress</div>
          <div class="rb-name">${escHtml(state.active.dayName)} — resume</div>
        </div>
        ${ICON_CHEVRON_RIGHT}
      </button>`;
    }
    const dayCards = state.days.map(d => {
      let metaHtml = '';
      if(d.id !== 'sat'){
        const exCount = d.items.filter(i=>i.itemType==='exercise').length;
        const hasRun = d.items.some(i=>i.itemType==='run');
        const meta = `${numDisplay(exCount)} exercise${exCount===1?'':'s'}${hasRun ? ' + run' : ''}`;
        metaHtml = `<div class="day-meta">${meta}</div>`;
      }
      return `
      <div class="day-card">
        <button class="day-main" data-action="start-workout" data-day="${d.id}">
          <div class="day-name">${escHtml(d.name)}</div>
          ${metaHtml}
        </button>
        <div class="day-actions">
          <button class="icon-btn" data-action="edit-day" data-day="${d.id}">${ICON_PENCIL}</button>
          <button class="icon-btn" data-action="start-workout" data-day="${d.id}">${ICON_CHEVRON_RIGHT}</button>
        </div>
      </div>`;
    }).join('');

    return `
      <div class="screen">
        <div class="topbar">
          <div class="topbar-row">
            <div class="wordmark">Axis</div>
            <button class="icon-btn" data-action="open-settings">${ICON_GEAR}</button>
          </div>
          <div class="page-title">Train</div>
          <div class="page-sub">${fmtDate(Date.now())}</div>
        </div>
        ${resumeHtml}
        <div class="day-list">${dayCards}</div>
      </div>
      ${navBar('home')}`;
  }

  /* ---------- render: DAY EDIT ---------- */
  function renderDayEdit(){
    const day = getDay(view.dayEditId);
    if(!day){ view.screen='home'; return renderHome(); }
    const rows = day.items.map(item => {
      const reorder = `<div class="reorder-col">
          <button class="icon-btn tiny" data-action="move-up" data-day="${day.id}" data-ex="${item.id}">${ICON_UP}</button>
          <button class="icon-btn tiny" data-action="move-down" data-day="${day.id}" data-ex="${item.id}">${ICON_DOWN}</button>
        </div>`;
      if(item.itemType === 'run'){
        return `<div class="field-row">${reorder}<div class="run-chip">${ICON_RUN} Run</div><button class="icon-btn danger" data-action="delete-item" data-day="${day.id}" data-ex="${item.id}">${ICON_TRASH}</button></div>`;
      }
      return `<div class="field-row">
        ${reorder}
        <input type="text" data-bind="template-exname" data-day="${day.id}" data-ex="${item.id}" value="${escAttr(item.name)}" placeholder="Exercise name">
        <div class="field-rest">
          <button class="rr-btn" data-action="rest-adjust-template" data-day="${day.id}" data-ex="${item.id}" data-delta="-15">−</button>
          <span>${secToMMSS(item.restSeconds||105)}</span>
          <button class="rr-btn" data-action="rest-adjust-template" data-day="${day.id}" data-ex="${item.id}" data-delta="15">+</button>
        </div>
        <button class="icon-btn danger" data-action="delete-item" data-day="${day.id}" data-ex="${item.id}">${ICON_TRASH}</button>
      </div>`;
    }).join('');
    const emptyMsg = day.items.length===0 ? `<div class="empty-state" style="margin:8px 20px 4px;padding:14px;"><strong>No exercises yet</strong>Add the moves you plan to train on this day.</div>` : '';
    const chooserHtml = (view.chooserOpen && view.chooserOpen.scope==='template' && view.chooserOpen.day===day.id)
      ? `<div class="chooser-row">
          <button class="chooser-btn" data-action="add-item" data-scope="template" data-day="${day.id}" data-type="exercise">Exercise</button>
          <button class="chooser-btn" data-action="add-item" data-scope="template" data-day="${day.id}" data-type="run">Run</button>
        </div>` : '';
    return `
      <div class="screen">
        <div class="workout-header">
          <button class="btn-back" data-action="goto-home">${ICON_BACK}</button>
          <div class="wh-titles"><div class="workout-title-input">${escHtml(day.name)}</div></div>
        </div>
        <div class="section-label">Exercises</div>
        ${emptyMsg}
        <div>${rows}</div>
        <button class="add-exercise-btn" data-action="toggle-chooser" data-scope="template" data-day="${day.id}">Add Exercise + Run</button>
        ${chooserHtml}
        <div style="height:20px;"></div>
      </div>`;
  }

  /* ---------- render: WORKOUT (item cards) ---------- */
  function renderWorkoutItem(item){
    if(item.itemType === 'run'){
      const dist = item.distanceKm;
      const durSec = item.durationSec || 0;
      const pace = (dist && Number(dist) > 0) ? secToMMSS(durSec / Number(dist)) : '—';
      const reorder = `<div class="reorder-col">
          <button class="icon-btn tiny" data-action="move-up" data-ex="${item.id}">${ICON_UP}</button>
          <button class="icon-btn tiny" data-action="move-down" data-ex="${item.id}">${ICON_DOWN}</button>
        </div>`;
      return `
      <div class="running-card" id="item-card-${item.id}">
        <div class="exercise-head" style="padding:2px 4px 6px 2px;">
          ${reorder}
          <div class="running-title" style="flex:1;">${ICON_RUN} Run</div>
          <button class="icon-btn danger" data-action="delete-item" data-ex="${item.id}">${ICON_TRASH}</button>
        </div>
        <div class="running-grid">
          <div class="running-field">
            <label>Distance (km)</label>
            <input type="number" inputmode="decimal" step="0.01" data-bind="run-distance" data-ex="${item.id}" value="${dist===''?'':dist}" placeholder="0">
          </div>
          <div class="running-field">
            <label>Time (mm:ss)</label>
            <input type="text" inputmode="numeric" data-bind="run-duration" data-ex="${item.id}" value="${durSec>0?secToMMSS(durSec):''}" placeholder="0:00">
          </div>
        </div>
        <div class="running-pace"><span class="pace-num" id="pace-${item.id}">${pace}</span><span class="pace-unit">/ km pace</span></div>
      </div>`;
    }
    const reorder = `<div class="reorder-col">
        <button class="icon-btn tiny" data-action="move-up" data-ex="${item.id}">${ICON_UP}</button>
        <button class="icon-btn tiny" data-action="move-down" data-ex="${item.id}">${ICON_DOWN}</button>
      </div>`;
    const prev = state.active ? findPreviousSetsForDay(state.active.dayId, item.name) : null;
    const itemSets = Array.isArray(item.sets) ? item.sets : [];
    const setRows = itemSets.map((s,i) => {
      const prevSet = prev && prev[i];
      const prevTxt = prevSet ? `${numDisplay(prevSet.weight||0)}×${numDisplay(prevSet.reps||0)}` : '—';
      return `
      <div class="set-row ${s.completed?'is-done':''}">
        <div class="set-idx">${numDisplay(i+1)}</div>

        <input class="set-input" type="number" inputmode="numeric" placeholder="reps" data-bind="set-reps" data-ex="${item.id}" data-set="${s.id}" value="${s.reps===''?'':s.reps}">
        <div class="set-actions">
          <button class="set-check ${s.completed?'checked':''}" data-action="toggle-set" data-ex="${item.id}" data-set="${s.id}">${s.completed?ICON_CHECK:''}</button>
          <button class="icon-btn tiny" data-action="delete-set" data-ex="${item.id}" data-set="${s.id}">${ICON_X}</button>
        </div>
      </div>`;
    }).join('');
    return `
      <div class="exercise-card" id="item-card-${item.id}">
        <div class="exercise-head">
          ${reorder}
          <input class="exercise-name-input" data-bind="ex-name" data-ex="${item.id}" value="${escAttr(item.name)}" placeholder="Exercise name">
          <button class="icon-btn" data-action="show-progress" data-ex="${item.id}">${ICON_CHART}</button>
          <button class="icon-btn danger" data-action="delete-item" data-ex="${item.id}">${ICON_TRASH}</button>
        </div>
        <div class="set-table">
          <div class="set-row set-row-head"><div>Set</div><div>Prev</div><div>Kg</div><div>Reps</div><div></div></div>
          ${setRows || '<div style="padding:10px 0;color:var(--text-faint);font-size:12px;">No sets yet.</div>'}
          <button class="add-set-btn" data-action="add-set" data-ex="${item.id}">${ICON_PLUS} Add set</button>
          ${renderRestRow(item)}
        </div>
      </div>`;
  }

  function renderItemsContainerContent(){

    const itemsHtml = a.items.map(renderWorkoutItem).join('');
    const chooserHtml = (view.chooserOpen && view.chooserOpen.scope==='active')

    return `${itemsHtml}<button class="add-exercise-btn" data-action="toggle-chooser" data-scope="active">Add Exercise + Run</button>${chooserHtml}`;
  }
  function refreshItemsContainer(){

  function refreshItemCard(exId){
    if(!state.active) return;
    const item = findItemInActive(exId);
    const card = document.getElementById('item-card-'+exId);
    if(item && card) card.outerHTML = renderWorkoutItem(item);

  function renderWorkout(){
    const a = state.active;
    if(!a){ view.screen='home'; return renderHome(); }
    return `
      <div class="screen">
        <div class="workout-header">
          <button class="btn-back" data-action="request-discard">${ICON_BACK}</button>
          <div class="wh-titles">
